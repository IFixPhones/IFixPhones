<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --white:#fff;--mist:#f5f5f7;--mist2:#ececf0;--ink:#1d1d1f;--graphite:#6e6e73;--line:#d2d2d7;--line2:#e5e5ea;
  --blue:#0071e3;--blue-h:#0077ed;--link:#0066cc;--green:#1a7f37;--red:#c9302c;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);color:var(--ink);background:var(--mist);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45;letter-spacing:-.01em;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
a{color:var(--link);text-decoration:none}
:focus-visible{outline:3px solid rgba(0,113,227,.45);outline-offset:2px;border-radius:8px}
.hidden{display:none!important}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.gate .card{background:#fff;border-radius:22px;box-shadow:0 10px 40px rgba(0,0,0,.08);padding:44px 36px;max-width:380px;width:100%;text-align:center}
.gate h1{font-size:28px;letter-spacing:-.02em;margin-bottom:6px}
.gate p{color:var(--graphite);margin-bottom:26px}
.gbtn{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:12px 22px;font-weight:600;font-size:15px}
.gbtn:hover{background:var(--mist)}
.gate .err{color:var(--red);margin-top:16px;font-size:14px;min-height:20px}
.muted{color:var(--graphite)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* top bar */
.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(0,0,0,.08)}
.top .tin{max-width:1920px;margin:0 auto;padding:0 clamp(16px,2.2vw,40px);height:58px;display:flex;align-items:center;gap:16px}
.brand{font-weight:700;font-size:19px;letter-spacing:-.035em;white-space:nowrap}
.brand span{color:var(--graphite);font-weight:500;margin-left:6px}
.tabs{display:flex;background:var(--mist);border-radius:10px;padding:3px;gap:2px}
.tabs button{border:0;background:transparent;padding:6px 14px;border-radius:8px;font-size:14px;color:var(--ink)}
.tabs button[aria-pressed="true"]{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.grow{flex:1}
.me{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px 5px 5px;font-size:14px;white-space:nowrap}
.av{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;background:var(--blue);color:#fff;border-radius:999px;padding:9px 18px;font-size:15px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--blue-h)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost:hover{background:var(--mist)}
.btn.dark{background:var(--ink)}
.btn.dark:hover{background:#000}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.danger{background:#fff;color:var(--red);box-shadow:inset 0 0 0 1px #f0c9c7}
.btn[disabled]{opacity:.5;cursor:default}
.link{border:0;background:none;color:var(--link);padding:0;font-size:inherit}
.link.red{color:var(--red)}

S.dl = { save: function(o){
  return new Promise(function(res){
    var type = /\.csv$/.test(o.filename) ? 'text/csv' : 'text/html';
    var url = URL.createObjectURL(new Blob([o.data], {type:type+';charset=utf-8'}));
    var a = document.createElement('a'); a.href = url; a.download = o.filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000); res();
  });
}};

var unsubs = [];
function stopListening(){ unsubs.forEach(function(u){ try{u();}catch(e){} }); unsubs = []; }

function gate(msg){
  S.status = 'signin'; clearTimeout(loadTimer);
  $('#layer').innerHTML = '';
  $('#app').innerHTML = '<div class="gate"><div class="card"><h1>iFixPhones</h1><p>Tickets · staff only</p>' +
    '<button class="gbtn" id="gsign"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Sign in with Google</button>' +
    '<div class="err" role="alert">'+esc(msg||'')+'</div></div></div>';
  $('#gsign').onclick = function(){
    var b = this; b.disabled = true;
    var prov = new firebase.auth.GoogleAuthProvider(); prov.setCustomParameters({prompt:'select_account'});
    firebase.auth().signInWithPopup(prov).catch(function(e){
      b.disabled = false;
      var c = e && e.code;
      if (c === 'auth/popup-closed-by-user' || c === 'auth/cancelled-popup-request') return;
      if (c === 'auth/popup-blocked') return firebase.auth().signInWithRedirect(prov);
      if (c === 'auth/unauthorized-domain') { $('.gate .err').textContent = 'This address isn’t approved in Firebase yet (Authentication → Settings → Authorized domains).'; return; }
      $('.gate .err').textContent = 'Couldn’t sign in. Check your connection and try again.';
    });
  };
}

/* ---------- alerts ---------- */
var BOOT = Date.now(), seenTickets = null, seenReqs = null, actx = null;
function ding(){
  if (S.settings.sound === false) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    [[880,0],[1318.5,0.16]].forEach(function(n){
      var o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime + n[1];
      o.type = 'sine'; o.frequency.value = n[0];
      g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.45);
      o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0 + 0.5);
    });
  } catch(e) {}
}
var titleT = 0;
function alertNew(title, body, go){
  ding();
  toast(title + (body ? ' · ' + body.split('\n')[0] : ''));
  try {
    if (window.Notification && Notification.permission === 'granted' && (document.hidden || !document.hasFocus())) {
      var n = new Notification(title, {body: body, icon: 'icon-192.png', tag: title + body});
      n.onclick = function(){ window.focus(); if (go) go(); n.close(); };
    }
  } catch(e) {}
  if (document.hidden || !document.hasFocus()) {
    clearInterval(titleT); var on = false, base = 'iFixPhones Tickets';
    titleT = setInterval(function(){ document.title = (on = !on) ? '● ' + title : base; }, 1000);
    var stop = function(){ clearInterval(titleT); document.title = base; window.removeEventListener('focus', stop); };
    window.addEventListener('focus', stop);
  }
}
function askNotify(){ try { if (window.Notification && Notification.permission === 'default') Notification.requestPermission(); } catch(e) {} }
document.addEventListener('pointerdown', function once(){ askNotify(); try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} document.removeEventListener('pointerdown', once); });
function pushPhone(title, msg){
  try { fetch('https://api.pushover.net/1/messages.json', {method:'POST', mode:'no-cors', body: new URLSearchParams({token:PO_TOKEN, user:PO_USER, title:title, message:msg, url:'https://ifixphones.net/tickets.html', url_title:'Open tickets'})}).catch(function(){}); } catch(e) {}
}

function startData(){
  var db = firebase.firestore();
  seenTickets = null; seenReqs = null; S.reqs = []; S.reqsErr = false;
  S.db = db; S.status = 'loading'; render();
  unsubs.push(db.collection('requests').orderBy('createdAt','desc').limit(300).onSnapshot(function(snap){
    S.reqs = snap.docs.map(function(d){ var o = clone(d.data()); o.id = d.id; return o; });
    if (seenReqs && !snap.metadata.fromCache) {
      snap.docChanges().forEach(function(ch){
        if (ch.type !== 'added' || seenReqs[ch.doc.id] || ch.doc.metadata.hasPendingWrites) return;
        var r = ch.doc.data() || {};
        if (r.kind === 'sell') alertNew('Someone wants to sell a phone', (r.device||'') + ' · ' + (r.repair||''), function(){ S.view='bookings'; render(); });
        else if (r.kind === 'checkin') alertNew('Online check-in · ' + (r.whenText||''), (r.name||'') + ' · ' + (r.device||'') + ' · ' + (r.repair||''), function(){ S.view='bookings'; render(); });
        else if (r.kind === 'business') alertNew('New school / business request', (r.org||'') + ' · ' + (r.name||''), function(){ S.view='bookings'; render(); });
        else if (r.kind === 'quote') alertNew('New quote request', (r.device||'') + (r.notes ? ' — ' + r.notes.slice(0,80) : ''), function(){ S.view='bookings'; render(); });
        else alertNew(r.where === 'mobile' ? 'New MOBILE booking' : 'New shop booking', (r.whenText||'') + '\n' + (r.name||'') + ' · ' + (r.device||'') + ' · ' + (r.repair||''), function(){ S.view='bookings'; render(); });
      });
    }
    if (!snap.metadata.fromCache) { seenReqs = {}; S.reqs.forEach(function(r){ seenReqs[r.id] = 1; }); }
    render();
  }, function(){ S.reqsErr = true; render(); }));
  unsubs.push(db.collection('inventory').onSnapshot(function(snap){ S.inv = snap.docs.map(function(d){ var o = clone(d.data()); o.id = d.id; return o; }); render(); }, function(){}));
  unsubs.push(db.collection('buybacks').orderBy('createdAt','desc').limit(500).onSnapshot(function(snap){ S.bb = snap.docs.map(function(d){ var o = clone(d.data()); o.id = d.id; return o; }); render(); }, function(){}));
  var seenApv = null;
  unsubs.push(db.collection('approvals').orderBy('createdAt','desc').limit(200).onSnapshot(function(snap){
    snap.docs.forEach(function(d){
      var a = d.data() || {};
      if (a.status !== 'pending') {
        if (seenApv && seenApv[d.id] === 'pending') alertNew('Customer ' + (a.status === 'approved' ? 'approved' : 'declined') + ' extra work', '#' + a.n + ' · ' + a.item + ' · ' + money(a.price), function(){ openTicket(a.tid); });
        applyApproval(d.id, a);
      }
    });
    if (!snap.metadata.fromCache) { seenApv = {}; snap.docs.forEach(function(d){ seenApv[d.id] = (d.data()||{}).status; }); }
  }, function(){}));
  unsubs.push(db.collection('customers').onSnapshot(function(snap){ var o = {}; snap.docs.forEach(function(d){ o[d.id] = clone(d.data()); }); S.custs = o; render(); }, function(){}));
  unsubs.push(db.collection('expenses').orderBy('at','desc').limit(1500).onSnapshot(function(snap){ S.exp = snap.docs.map(function(d){ var o = clone(d.data()); o.id = d.id; return o; }); render(); }, function(){}));
  unsubs.push(db.collection('clock').orderBy('in','desc').limit(400).onSnapshot(function(snap){ S.clock = snap.docs.map(function(d){ var o = clone(d.data()); o.id = d.id; return o; }); render(); }, function(){}));
  unsubs.push(db.doc('public/site').onSnapshot(function(snap){ S.pub = snap.exists ? clone(snap.data()) : {}; render(); }, function(){}));
  unsubs.push(db.collection('avail').onSnapshot(function(snap){
    var o = {}; snap.docs.forEach(function(d){ o[d.id] = clone(d.data()); }); S.avail = o; render();
  }, function(){}));
  unsubs.push(db.collection('tickets').orderBy('createdAt','desc').limit(2000).onSnapshot({includeMetadataChanges:true}, function(snap){
    S.tickets = snap.docs.map(function(d){ var o = clone(d.data()); o.id = d.id; return o; });
    if (seenTickets && !snap.metadata.fromCache) {
      snap.docChanges().forEach(function(ch){
        if (ch.type !== 'added' || seenTickets[ch.doc.id] || ch.doc.metadata.hasPendingWrites) return;
        var t = ch.doc.data() || {};
        if ((t.createdAt||0) < BOOT) return;
        alertNew('New ticket #' + t.num, (t.customer && t.customer.name || '') + ' · ' + (t.device && t.device.model || '') + (t.createdBy ? ' · by ' + t.createdBy : ''), function(){ openTicket(ch.doc.id); });
      });
    }
    if (!snap.metadata.fromCache) { seenTickets = seenTickets || {}; S.tickets.forEach(function(t){ seenTickets[t.id] = 1; }); }
    S.status = 'ready';
    S.cacheOnly = !!snap.metadata.fromCache;
    if (!snap.metadata.fromCache) { clearTimeout(loadTimer); S.slow = false; }
    render();
  }, function(err){
    clearTimeout(loadTimer);
    S.status = (err && err.code === 'permission-denied') ? 'revoked' : 'error';
    render();
  }));
  unsubs.push(db.doc('settings/main').onSnapshot(function(snap){
    S.settingsLoaded = true;
    if (snap.exists) {
      var d = snap.data() || {};
      S.settings = Object.assign({techs:DEFAULT_TECHS.slice()}, clone(d));
      if (!Array.isArray(S.settings.techs)) S.settings.techs = DEFAULT_TECHS.slice();
    }
    render();
  }, function(){}));
}

(function(){
  if (!window.firebase) { S.status = 'nodb'; clearTimeout(loadTimer); render(); return; }
  firebase.initializeApp(FB_CONFIG);
  var fs = firebase.firestore();
  try { fs.settings({ignoreUndefinedProperties:true, merge:true}); } catch(e) {}
  try { fs.enablePersistence({synchronizeTabs:true}).catch(function(){}); } catch(e) {}
  firebase.auth().getRedirectResult().catch(function(){});
  firebase.auth().onAuthStateChanged(function(u){
    stopListening();
    if (!u) { S.authUser = null; gate(); return; }
    var em = String(u.email||'').toLowerCase();
    if (ALLOWED.indexOf(em) < 0) {
      firebase.auth().signOut().then(function(){ gate(em + ' doesn’t have access. Sign in with the shop account.'); });
      return;
    }
    S.authUser = u;
    startData();
  });
})();

function signOut(){
  if (!confirm('Sign out of iFixPhones Tickets on this computer?')) return;
  stopListening(); S.tickets = []; S.status = 'loading';
  firebase.auth().signOut();
}

/* ---------- rendering ---------- */
var raf = 0;
function renderSoon(){ if (raf) return; raf = requestAnimationFrame(function(){ raf = 0; render(); }); }

function render(){
  if (S.status === 'signin') return;
  var app = $('#app');
  app.innerHTML = topbar() + '<div class="wrap">' + mobileTabs() + body() + '</div>' +
    (S.view === 'tickets' && S.status === 'ready' && S.canWrite ? '<button class="btn fab" data-act="new">+ New ticket</button>' : '');
  restoreSearchFocus();
  if (S.openId) renderSheet(); else if (S.profile) renderProfile();
  maybeAskWho();
  if (S.status === 'ready' && !S.cacheOnly) backfillStatus();
  if (S.status === 'ready' && /#t=\d+/.test(location.hash||'')) setTimeout(checkHash, 50);
}

function newReqCount(){ return (S.reqs||[]).filter(function(r){ return r.status === 'new'; }).length; }
function tabBadge(v){ if (v === 'parts') { var lc = lowCount(); return lc ? '<span class="tbadge" style="background:#b25000" aria-label="'+lc+' running low">'+lc+'</span>' : ''; } if (v !== 'bookings') return ''; var n = newReqCount(); return n ? '<span class="tbadge" aria-label="'+n+' new">'+n+'</span>' : ''; }
function topbar(){
  var tabs = VIEWS.map(function(t){
    return '<button data-act="view" data-v="'+t[0]+'" aria-pressed="'+(S.view===t[0])+'">'+t[1]+tabBadge(t[0])+'</button>';
  }).join('');
  return '<header class="top"><div class="tin">' +
    '<div class="brand">iFixPhones<span>Tickets</span></div>' +
    '<nav class="tabs" aria-label="Sections">' + tabs + '</nav>' +
    '<div class="grow"></div>' +
    '<button class="me" data-act="who" aria-label="Working as '+esc(who())+'. Change"><span class="av">'+esc(S.me ? initials(S.me) : '?')+'</span><span class="nm">'+esc(S.me ? S.me : 'Who’s working?')+'</span></button>' +
    (S.status==='ready' && S.canWrite ? '<button class="btn" data-act="new">+ <span class="newtxt">New ticket</span></button>' : '') +
  '</div></header>';
}
function mobileTabs(){
  return '<nav class="tabs mtabs" aria-label="Sections">' + VIEWS.map(function(t){
    return '<button data-act="view" data-v="'+t[0]+'" aria-pressed="'+(S.view===t[0])+'">'+t[1]+tabBadge(t[0])+'</button>';
  }).join('') + '</nav>';
}

function body(){
  if (S.status === 'nodb') return '<div class="panel empty"><h3>Couldn’t start</h3><p>Check the internet connection, then reload.</p></div>';
  if (S.status === 'revoked') return '<div class="panel empty"><h3>No access</h3><p>This account can’t open tickets.</p><button class="btn ghost" data-act="signout">Sign out</button></div>';
  if (S.status === 'error') return '<div class="panel empty"><h3>Tickets couldn’t load</h3><p>Check your connection, then reopen this page.</p></div>';
  var note = '';
  if (S.slow) note = '<div class="notice warn">Offline or slow connection. You’re seeing saved tickets; changes will sync when the internet is back.</div>';
    if (S.status === 'loading') return note + '<div class="list">' + '<div class="skel"></div>'.repeat(6) + '</div>';
  if (S.view === 'customers') return note + customersView();
  if (S.view === 'parts') return note + partsView();
  if (S.view === 'reports') return note + reportsView();
  if (S.view === 'settings') return note + settingsView();
  if (S.view === 'bookings') return note + bookingsView();
  if (S.view === 'buyback') return note + buybackView();
  return note + ticketsView();
}

function counts(){
  var c = {active:0, all:S.tickets.length};
  STATUSES.forEach(function(s){ c[s.k] = 0; });
  c.overdue = 0;
  S.tickets.forEach(function(t){ c[t.status] = (c[t.status]||0) + 1; if (ACTIVE.indexOf(t.status) > -1) c.active++; if (isOverdue(t)) c.overdue++; });
  return c;
}

function matches(t, q){
  if (!q) return true;
  var hay = [t.num, t.customer && t.customer.name, t.customer && digits(t.customer.phone), t.device && t.device.model, t.device && t.device.imei, repairsText(t), t.assigned].join(' ').toLowerCase();
  return q.toLowerCase().split(/\s+/).every(function(w){
    if (!w) return true;
    var d = digits(w);
    return hay.indexOf(w.replace(/^#/,'')) > -1 || (d.length >= 3 && hay.indexOf(d) > -1);
  });
}

function ticketsView(){
  var c = counts();
  var paidToday = S.tickets.filter(function(t){ return t.paid && t.paidAt && sameDay(t.paidAt, Date.now()); }).reduce(function(a,t){ return a + collected(t); }, 0);
  var stats = '<div class="stats">' +
    '<button class="stat" data-act="filter" data-v="active"><b>'+c.active+'</b><span>Open tickets</span></button>' +
    '<button class="stat" data-act="filter" data-v="ready"><b>'+c.ready+'</b><span>Ready for pickup</span></button>' +
    '<button class="stat" data-act="filter" data-v="overdue"><b'+(c.overdue?' style="color:var(--red)"':'')+'>'+c.overdue+'</b><span>Past promised time</span></button>' +
    '<div class="stat"><b>'+money(paidToday)+'</b><span>Paid today</span></div>' +
  '</div>';

  var chipDefs = [['active','Open']].concat(c.overdue || S.filter==='overdue' ? [['overdue','Overdue']] : []).concat(STATUSES.map(function(s){ return [s.k, s.short]; })).concat([['all','All']]);
  var chips = chipDefs.map(function(d){
    return '<button class="chip" data-act="filter" data-v="'+d[0]+'" aria-pressed="'+(S.filter===d[0])+'">'+esc(d[1])+' <i>'+(c[d[0]]||0)+'</i></button>';
  }).join('');
  var bar = '<div class="bar"><div class="search"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#6e6e73" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="5.2"/><path d="M11 11l3.5 3.5"/></svg>' +
    '<label class="sr" for="q">Search tickets</label><input id="q" type="search" placeholder="Search name, phone, device, ticket #" value="'+esc(S.q)+'" autocomplete="off"></div></div>' +
    '<div class="chips" role="group" aria-label="Filter by status" style="margin-bottom:14px">' + chips + '</div>';

  var list = S.tickets.filter(function(t){
    if (S.filter === 'active' && ACTIVE.indexOf(t.status) < 0) return false;
    if (S.filter === 'overdue' && !isOverdue(t)) return false;
    if (['active','all','overdue'].indexOf(S.filter) < 0 && t.status !== S.filter) return false;
    return matches(t, S.q);
  });

  var rows;
  if (!S.tickets.length) {
    rows = '<div class="empty"><h3>No tickets yet</h3><p>Check in your first repair to get started.</p>' + (S.canWrite ? '<button class="btn" data-act="new">+ New ticket</button>' : '') + '</div>';
  } else if (!list.length) {
    rows = '<div class="empty"><h3>Nothing here</h3><p>No tickets match' + (S.q ? ' “'+esc(S.q)+'”' : ' this filter') + '.</p>' + (S.q || S.filter!=='all' ? '<button class="btn ghost" data-act="clearq">Show all tickets</button>' : '') + '</div>';
  } else {
    rows = '<div class="lhead"><div>Ticket</div><div>Customer</div><div>Device and repair</div><div>Tech</div><div>Status</div><div class="right">Total</div><div class="right">Updated</div></div>' +
      list.map(rowHtml).join('');
  }
  var sod = new Date(); sod.setHours(0,0,0,0);
  var tAp = (S.reqs||[]).filter(function(r){ return isBooking(r) && (r.status === 'new' || r.status === 'confirmed') && r.apptAt >= sod.getTime() && r.apptAt < sod.getTime() + 86400e3; }).sort(function(a,b){ return a.apptAt - b.apptAt; });
  var strip = tAp.length ? '<div class="todayap"><b>Today:</b>' + tAp.map(function(r){ return '<button class="chip" data-act="rqshow" data-id="'+esc(r.id)+'">'+esc(r.time)+' · '+esc(String(r.name||fmtPhone(r.phone)).split(' ')[0])+(r.where==='mobile'?' · 🚗':'')+'</button>'; }).join('') + '</div>' : '';
  var fu = followups();
  var bk = backupDue() ? '<div class="todayap"><span>💾 <b>Weekly backup is due.</b> It saves a copy of every ticket to this computer.</span><button class="btn sm ghost" data-act="csv" style="margin-left:auto">Back up now</button></div>' : '';
  var fuStrip = fu.length ? '<div class="todayap" style="background:#fff8e6"><span>🔔 <b>'+fu.length+' follow-up'+(fu.length>1?'s':'')+'</b>: ' + esc([['review','review request'],['pickup','pickup reminder']].map(function(k){ var n = fu.filter(function(f){ return f.kind === k[0]; }).length; return n ? n + ' ' + k[1] + (n>1?'s':'') : ''; }).filter(Boolean).join(', ')) + '</span><button class="btn sm" data-act="followups" style="margin-left:auto">Open</button></div>' : '';
  var mode = '<div class="bkbar" style="margin:-4px 0 12px"><div class="seg" role="group" aria-label="Layout"><button data-act="tmode" data-v="list" aria-pressed="'+(S.tMode!=='board')+'">List</button><button data-act="tmode" data-v="board" aria-pressed="'+(S.tMode==='board')+'">Shop screen</button></div>'+(S.tMode==='board'?'<button class="btn sm ghost" data-act="fullboard" style="margin-left:auto">Full screen</button>':'')+'</div>';
  if (S.tMode === 'board') return fuStrip + mode + boardView();
  return bk + fuStrip + strip + mode + stats + bar + '<div class="list">' + rows + '</div>';
}

function rowHtml(t){
  var tot = total(t), bal = balance(t);
  var amt = tot ? '<div class="amt">'+money(tot)+'</div>' + (t.paid ? '<div class="paid">Paid</div>' : (num(t.deposit) ? '<div class="due">'+money(bal)+' due</div>' : '')) : '<div class="t2">No price</div>';
  return '<button class="row" data-act="open" data-id="'+esc(t.id)+'">' +
    '<div class="c-num"><span class="num">#'+esc(t.num)+'</span></div>' +
    '<div class="c-cust"><div class="t1">'+esc(t.customer && t.customer.name)+'</div><div class="t2">'+esc(fmtPhone(t.customer && t.customer.phone))+'</div></div>' +
    '<div class="c-dev"><div class="t1">'+esc(t.device && t.device.model)+(t.type==='mobile'?'<span class="mobtag">Mobile</span>':'')+(t.warrantyReturn?'<span class="wbadge">Warranty</span>':'')+'</div><div class="t2">'+esc(repairsText(t))+'</div></div>' +
    '<div class="c-tech t2">'+esc(t.assigned || '—')+'</div>' +
    '<div class="c-st">'+pill(t.status)+rowSub(t)+'</div>' +
    '<div class="c-amt right">'+amt+'</div>' +
    '<div class="c-age right t2" title="'+esc(dt(t.updatedAt))+'">'+esc(rel(t.updatedAt||t.createdAt))+'</div>' +
  '</button>';
}

function rowSub(t){
  if (t.status === 'ready') { var d = daysSince(readyAt(t)); return d >= 2 ? '<div class="duel wait">Waiting '+d+' days</div>' : ''; }
  if (['in','part','repair'].indexOf(t.status) < 0) return '';
  var op = openParts(t).length;
  if (t.dueAt) {
    var late = t.dueAt < Date.now(), soon = !late && t.dueAt - Date.now() < 2*3600e3;
    return '<div class="duel '+(late?'late':soon?'soon':'wait')+'">'+(late?'Was due ':'Due ')+esc(dueText(t.dueAt))+'</div>';
  }
  return op ? '<div class="duel wait">'+op+' part'+(op===1?'':'s')+' pending</div>' : '';
}

function partsView(){

function followups(){

/* ---------- QR ---------- */
function qrSvg(text, px){
  try {
    var q = qrcode(0, 'M'); q.addData(text); q.make();
    var n = q.getModuleCount(), cell = (px || 96) / (n + 2), r = '';
    for (var y = 0; y < n; y++) for (var x = 0; x < n; x++) if (q.isDark(y, x)) r += 'M' + ((x+1)*cell).toFixed(2) + ' ' + ((y+1)*cell).toFixed(2) + 'h' + cell.toFixed(2) + 'v' + cell.toFixed(2) + 'h-' + cell.toFixed(2) + 'z';
    return '<svg xmlns="http://www.w3.org/2000/svg" width="'+px+'" height="'+px+'" viewBox="0 0 '+px+' '+px+'"><rect width="100%" height="100%" fill="#fff"/><path d="'+r+'" fill="#000"/></svg>';
  } catch(e) { return ''; }
}

/* ---------- inventory ---------- */
var STOCK_CATS = ['Screen','Battery','Charging port','Back glass','Camera','Speaker','Other'];

function partTypes(brand, model){
  var m = String(model||'');
  if (brand === 'Apple iPhone') {
    var oledOnly = /iPhone (1[7-9]|2\d)|iPhone Air|iPhone Duo/.test(m) && !/\d+e\b/.test(m);
    var oled = oledOnly || /(1[3-9]|2\d) Pro/.test(m);
    return (oledOnly ? [] : ['Screen · Incell']).concat(oled ? ['Screen · OLED'] : []).concat(['Screen · Original','Battery','Charging port']).concat(/iPhone [78]\b|iPhone 7 Plus/.test(m) ? [] : ['Back glass']).concat(['Rear camera']);
  }
  if (brand === 'Apple iPad' || /Tab/.test(m)) return ['Screen / digitizer','LCD','Battery','Charging port'];
  if (/Fold/.test(m)) return ['Inner screen','Outer screen','Battery','Charging port','Back glass'];
  return ['Screen','Battery','Charging port','Back glass','Rear camera'];
}
function stockId(brand, model, part){ return (brand + '-' + model + '-' + part).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 140); }
function invById(id){ return (S.inv||[]).filter(function(x){ return x.id === id; })[0]; }
function stockLow(i){ return num(i.qty) <= num(i.min == null ? 1 : i.min); }
function isTracked(i){ return num(i.min == null ? 1 : i.min) > 0; }
function lowCount(){ return (S.inv||[]).filter(function(i){ return isTracked(i) && stockLow(i); }).length; }
function stockView(){

  var bar = '<div class="bar"><div class="search"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#6e6e73" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="5.2"/><path d="M11 11l3.5 3.5"/></svg><label class="sr" for="q">Search models</label><input id="q" type="search" placeholder="Search a model, e.g. 14 Pro" value="'+esc(S.q)+'" autocomplete="off"></div>' +

      '<div class="acts" style="margin:10px 0"><button class="btn sm" data-act="stockadd">+ Add other part</button></div></div>';
  } else {

    if (S.stockOnly) list = list.filter(function(x){ return inv.some(function(i){ return i.brand === x.b && i.model === x.m && num(i.qty) > 0; }); });

function bumpPart(spec, delta){

function shrink(file){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onload = function(){
      var im = new Image();
      im.onload = function(){
        var tries = [[1280,0.72],[1024,0.65],[800,0.6]];
        for (var i = 0; i < tries.length; i++) {
          var sc = Math.min(1, tries[i][0] / Math.max(im.width, im.height)), c = document.createElement('canvas');
          c.width = Math.round(im.width * sc); c.height = Math.round(im.height * sc);
          c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
          var d = c.toDataURL('image/jpeg', tries[i][1]);
          if (d.length < 700000 || i === tries.length - 1) return res(d);
        }
      };
      im.onerror = function(){ rej(new Error('img')); };
      im.src = fr.result;
    };
    fr.onerror = function(){ rej(new Error('read')); };
    fr.readAsDataURL(file);
  });
}

  Promise.all(files.map(shrink)).then(function(datas){
    var live = byId(t.id) || t, list = (live.photos||[]).slice(), now = Date.now();
    var b = S.db.batch();
    datas.forEach(function(d, i){ var k = (now + i).toString(36); list.push({k:k, at:now, by:who()}); S.photoCache[t.id + '_' + k] = d; b.set(S.db.doc('photos/' + t.id + '_' + k), {tid:t.id, data:d, at:now, by:who()}); });

  var past = all.filter(function(r){ return r.status === 'done' || r.status === 'cancel'; }).sort(function(a,b){ return (b.updatedAt||b.createdAt) - (a.updatedAt||a.createdAt); }).slice(0, 30);
  var tmr = conf.filter(function(r){ return r.apptAt >= eod && r.apptAt < eod + 86400e3 && !r.remindedAt; });
  if (!all.length) return '<div class="panel empty"><h3>No bookings yet</h3><p>Appointments and quote requests from ifixphones.net show up here right away, with a ding.</p></div>';
  return (tmr.length ? '<div class="remind"><span>🔔 <b>'+tmr.length+' appointment'+(tmr.length>1?'s':'')+' tomorrow</b> still need'+(tmr.length>1?'':'s')+' a reminder text.</span></div>' : '') +

    (today.length ? '<h3 class="bkh">Today</h3>' + today.map(reqBox).join('') : '') +
    (later.length ? '<h3 class="bkh">Coming up</h3>' + later.map(reqBox).join('') : '') +
    (!newOnes.length && !conf.length ? '<div class="panel empty" style="padding:30px"><h3>All caught up</h3><p>No open bookings right now.</p></div>' : '') +

  if (v === 'arrived') p.arrivedAt = Date.now();
  if (v === 'used') p.usedAt = Date.now();
  var fields = {parts:parts};
  var logs = [logEntry('marked part “' + p.name + '” ' + PSMAP[v].toLowerCase() + (v==='ordered' && orderNo ? ' (order ' + orderNo + ')' : ''))];

}

/* ---------- status / actions ---------- */
async function setStatus(t, k){
  if (t.status === k) return;
  if (k === 'done' && !t.paid && balance(t) > 0) {
    var ok = await confirmBox('Mark as picked up?', 'This ticket still shows ' + money(balance(t)) + ' unpaid. Mark it picked up anyway?', 'Picked up, unpaid');
    if (!ok) return;
  }
  if (k === 'cancel') {
    var ok2 = await confirmBox('Cancel this ticket?', 'The ticket stays in your history as Cancelled. The passcode will be deleted.', 'Cancel ticket', true);
    if (!ok2) return;
  }
  var fields = {status:k};
  var logs = [logEntry('changed status to ' + SMAP[k].label)];
  if (k === 'done') fields.pickedUpAt = Date.now();
  if ((k === 'done' || k === 'cancel') && t.device && t.device.passcode) {
    fields.device = Object.assign({}, t.device, {passcode:''});
    logs.push(logEntry('deleted the passcode'));
  }
  patchTicket(t, fields, logs);
  toast(SMAP[k].label);
}

function confirmBox(title, text, okLabel, danger){
  return new Promise(function(resolve){
    var m = document.createElement('div');
    m.className = 'modal'; m.setAttribute('role','dialog'); m.setAttribute('aria-modal','true');
    m.innerHTML = '<div class="scrim on" style="position:fixed"></div><div class="mbox sm" style="position:relative;z-index:41;margin-top:12vh"><div class="mbody"><h2 style="font-size:20px;letter-spacing:-.02em;margin-bottom:6px">'+esc(title)+'</h2><p class="muted">'+esc(text)+'</p></div>' +
      '<div class="mfoot"><button class="btn ghost" data-r="0">Go back</button><button class="btn '+(danger?'danger':'')+'" data-r="1">'+esc(okLabel)+'</button></div></div>';
    document.body.appendChild(m);
    requestAnimationFrame(function(){ m.classList.add('on'); var b0 = $('[data-r="1"]', m); if (b0) b0.focus(); });
    function done(v){ m.remove(); document.removeEventListener('keydown', key, true); resolve(v); }
    function key(e){ if (e.key === 'Escape') { e.stopPropagation(); done(false); } }
    document.addEventListener('keydown', key, true);
    m.addEventListener('click', function(e){
      var b = e.target.closest('[data-r]'); if (b) done(b.getAttribute('data-r') === '1');
      else if (e.target.classList.contains('scrim')) done(false);
    });
  });
}

function submitForm(t, m, closeForm){
  syncItems();

  var bad = [];

  if (!name) bad.push('tf-name');
  if (!model) bad.push('tf-model');
  if (NT.type === 'mobile' && !$('#tf-addr').value.trim()) bad.push('tf-addr');
  bad.forEach(function(id){ $('#'+id).classList.add('bad'); });
  if (bad.length) { err.textContent = digits(phone).length && digits(phone).length < 10 ? 'Enter a 10-digit phone number.' : 'Fill in the highlighted fields.'; $('#'+bad[0]).focus(); return; }
  if (!t && !$('#tf-agree').checked) { err.textContent = 'Confirm the customer agreed to the repair policy.'; $('#tf-agree').focus(); return; }

  var needDesc = NT.items.filter(function(i){ return (i.repair === 'Other repair' || i.repair === 'Other') && !String(i.desc||'').trim(); });
  if (needDesc.length) { var di = NT.items.indexOf(needDesc[0]); var de = $('#it-d' + di); if (de) { de.classList.add('bad'); de.focus(); } err.textContent = 'Describe the “Other repair”.'; return; }
  var items = NT.items.filter(function(i){ return i.repair; }).map(function(i){ var o = {repair:i.repair, part:i.part||'', price: i.price === '' ? '' : num(i.price)}; if ((i.repair === 'Other repair' || i.repair === 'Other') && i.desc) o.desc = String(i.desc).trim().slice(0,120); return o; });
  var data = {
    type: NT.type,
    address: NT.type === 'mobile' ? $('#tf-addr').value.trim() : '',
    customer: {name:name, phone:fmtPhone(phone), address:$('#tf-addr').value.trim(), email:$('#tf-email').value.trim()},
    device: {brand:$('#tf-brand').value || guessBrand(model), model:model, color:$('#tf-color').value.trim(), imei:$('#tf-imei').value.trim(), passcode:$('#tf-pc').value.trim()},
    items: items,
    deposit: num($('#tf-dep').value),
    depMethod: num($('#tf-dep').value) ? $('#tf-depm').value : '',
    discount: num($('#tf-disc').value),
    discountNote: $('#tf-discn').value.trim().slice(0,40),
    taxExempt: $('#tf-tex').checked,
    taxRate: NT.taxRate,
    assigned: $('#tf-tech').value,
    warranty: $('#tf-war').value,
    pre: m._pre,
    damage: $('#tf-dmg').value.trim(),
    liquid: $('#tf-liq').checked,
    dueAt: fromLocalInput($('#tf-due').value),
    warrantyReturn: $('#tf-wret').checked
  };
  var btn = $('#tf-save'); btn.disabled = true; btn.textContent = 'Saving…';

  if (t) {
    var live = byId(t.id); if (!live) { closeForm(); return; }
    var oldK = pubKey(live);
    patchTicket(live, data, [logEntry('edited the ticket details')]);
    syncStatusSoon(live, oldK);
    closeForm(); toast('Saved');
    return;
  }
  var now = Date.now();
  var body = Object.assign(data, {
    num: nextNum(), status:'in', createdAt:now, updatedAt:now, createdBy:who(),
    paid:false, payMethod:'', paidAt:0, agreed:true, post:{}, parts:[],
    sig: (m._sig && m._sig.has()) ? m._sig.data() : '', sigAt: (m._sig && m._sig.has()) ? now : 0,
    log:[logEntry('checked in the device')].concat(data.assigned ? [logEntry('assigned the ticket to ' + data.assigned)] : [])
  });
  var reqId = NT.reqId;
  var ref = S.db.collection('tickets').doc();
  retryOnce(function(){ return ref.set(body); }).then(function(){
    var sb = clone(body); sb.id = ref.id; syncStatus(sb);
    if (!byId(ref.id)) { var loc = clone(body); loc.id = ref.id; S.tickets.unshift(loc); }
    closeForm(); toast('Ticket #' + body.num + ' created');
    S.filter = 'active'; S.q = ''; S.view = 'tickets'; render();
    openTicket(ref.id);
    if (reqId) patchReq(reqId, {status:'done', ticketId: ref.id, ticketNum: body.num});
    if (S.settings.pushTickets !== false) pushPhone('New ticket #' + body.num, (body.customer.name||'') + ' · ' + (body.device.model||'') + ' · ' + repairsText(body) + ' · by ' + who());
    if (S.settings.autoLabel) { var nt2 = byId(ref.id); if (nt2) setTimeout(function(){ printLabel(nt2); }, 400); }
  }).catch(function(e){
    btn.disabled = false; btn.textContent = 'Check in';

    else if (e && e.code === 'permission-denied') { err.textContent = 'No permission. Sign in with the shop account.'; }
    else err.textContent = 'Couldn’t save. Check your connection and try again.';
  });
}

/* signature pad */
function sigPad(box, onSign){
  if (!box) return null;
  var cv = box.querySelector('canvas'), ctx = cv.getContext('2d'), drawing = false, has = false, last = null;
  function size(){
    var r = box.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    var img = has ? cv.toDataURL() : null;
    cv.width = Math.max(1, Math.round(r.width * dpr)); cv.height = Math.max(1, Math.round(r.height * dpr));
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1d1d1f';
    if (img) { var im = new Image(); im.onload = function(){ ctx.drawImage(im, 0, 0, r.width, r.height); }; im.src = img; }
  }
  requestAnimationFrame(size);
  function pt(e){ var r = cv.getBoundingClientRect(); return {x:e.clientX - r.left, y:e.clientY - r.top}; }
  cv.addEventListener('pointerdown', function(e){ e.preventDefault(); drawing = true; last = pt(e); try { cv.setPointerCapture(e.pointerId); } catch(x) {} ctx.beginPath(); ctx.arc(last.x, last.y, 1.1, 0, Math.PI*2); ctx.fillStyle = '#1d1d1f'; ctx.fill(); mark(); });
  cv.addEventListener('pointermove', function(e){ if (!drawing) return; var p = pt(e); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p; });
  ['pointerup','pointercancel','pointerleave'].forEach(function(ev){ cv.addEventListener(ev, function(){ drawing = false; }); });
  function mark(){ if (!has) { has = true; box.classList.add('has'); if (onSign) onSign(); } }
  return {
    has: function(){ return has; },
    clear: function(){ ctx.clearRect(0, 0, cv.width, cv.height); has = false; box.classList.remove('has'); },
    data: function(){
      // shrink to a small PNG on white
      var w = 480, h = Math.round(w * cv.height / cv.width), o = document.createElement('canvas'); o.width = w; o.height = h;
      var c2 = o.getContext('2d'); c2.fillStyle = '#fff'; c2.fillRect(0,0,w,h); c2.drawImage(cv, 0, 0, w, h);
      return o.toDataURL('image/png');
    }
  };
}

    case 'smodel': { S.openModels = S.openModels || {}; var mk = a.getAttribute('data-v'); S.openModels[mk] = !S.openModels[mk]; render(); break; }
    case 'stockonly': S.stockOnly = !S.stockOnly; render(); break;
    case 'pbump': bumpPart(JSON.parse(a.getAttribute('data-spec')), +a.getAttribute('data-v')); break;
    case 'partedit': partEditBox(JSON.parse(a.getAttribute('data-spec'))); break;
    case 'reorder': reorderBox(); break;
    case 'stockedit': { var si = (S.inv||[]).filter(function(x){ return x.id === a.getAttribute('data-id'); })[0]; if (si) stockBox(si); break; }
    case 'stockqty': stockQty(a.getAttribute('data-id'), +a.getAttribute('data-v')); break;
    case 'usestock': { var sp = $('#stk-pick'); if (t && sp && sp.value) useStock(t, sp.value); break; }
    case 'bbadd': bbBox(null); break;
    case 'bbedit': { var bi = (S.bb||[]).filter(function(x){ return x.id === a.getAttribute('data-id'); })[0]; if (bi) bbBox(bi); break; }
    case 'photo': if (t) photoBox(t, a.getAttribute('data-k')); break;
    case 'apvnew': if (t) apvBox(t); break;
    case 'rqbuy': { var rb = reqById(a.getAttribute('data-id')); if (rb) bbBox(null, {model:rb.device||'', cond: BB_COND.indexOf(rb.repair) > -1 ? rb.repair : 'Good', lock:rb.screen||'', sellerName:rb.name||'', sellerPhone:rb.phone||'', notes:rb.notes||'', reqId:rb.id}); break; }
    case 'warranty': warrantyBox(); break;
    case 'saverev': { var u = ($('#revurl')||{}).value || ''; u = u.trim(); if (u && !/^https:\/\//i.test(u)) { toast('Paste the full link starting with https://'); break; } savePublic({reviewUrl: u}); break; }
    case 'rmprice': { var pr2 = ((S.pub||{}).prices||[]).slice(); pr2.splice(+a.getAttribute('data-i'), 1); savePublic({prices: pr2}); break; }
    case 'rq': { var rq = reqById(a.getAttribute('data-id')), rv = a.getAttribute('data-v'); if (!rq) break; if (rv === 'cancel' && !confirm('Cancel this booking?' + (isBooking(rq) ? ' ' + rq.time + ' opens up again on the website.' : ''))) break; setReqStatus(rq, rv); break; }
    case 'rqdel': { var rd = reqById(a.getAttribute('data-id')); if (!rd || !confirm('Delete this booking for good?')) break; deleteReq(rd); break; }
    case 'rqmove': { var rm = reqById(a.getAttribute('data-id')); if (rm) moveBox(rm); break; }
    case 'rqshow': { var rs = reqById(a.getAttribute('data-id')); if (rs) showReq(rs); break; }
    case 'bkmode': S.bkMode = a.getAttribute('data-v'); render(); break;
    case 'wk': { var dv = +a.getAttribute('data-v'); var base = S.weekStart ? new Date(S.weekStart) : weekStart(new Date()); if (!dv) S.weekStart = null; else { base.setDate(base.getDate() + 7*dv); S.weekStart = base.getTime(); } render(); break; }
    case 'addappt': addApptBox(a.getAttribute('data-v') || ''); break;
    case 'blockday': blockDayBox(a.getAttribute('data-v')); break;
    case 'rqticket': { var rr = reqById(a.getAttribute('data-id')); if (!rr) break; if (!S.me) { whoBox(); break; } reqToTicket(rr); break; }
    case 'testalert': alertNew('Test alert', 'This is how new bookings will look.'); pushPhone('Test alert', 'Phone alerts are working.'); break;
    case 'sign': if (t) signBox(t); break;
    case 'delete': {
      if (!t) break;
      var ok3 = await confirmBox('Delete ticket #' + t.num + '?', 'This removes the ticket and its history for everyone. It can’t be undone. To keep a record, cancel it instead.', 'Delete ticket', true);
      if (!ok3) break;
      var id = t.id; dropStatus(t); closeSheet();
      S.tickets = S.tickets.filter(function(x){ return x.id !== id; }); render();
      enqueue('tickets/'+id, function(){ return retryOnce(function(){ return S.db.doc('tickets/'+id).delete(); }); }).then(function(){ toast('Ticket deleted'); }).catch(writeErr);
      break;
    }
  }
});

document.addEventListener('change', function(e){
  if (e.target.closest('.modal')) return;
  var el = e.target;
  if (el.hasAttribute && el.hasAttribute('data-photoin')) { var pt = S.openId ? byId(S.openId) : null; if (pt) addPhotos(pt, el.files); el.value = ''; return; }
  var cm = el.getAttribute('data-comm');
  if (cm) { var co = Object.assign({}, S.settings.commission||{}); co[cm] = num(el.value); saveSettings({commission: co}); toast('Saved'); return; }
  var sk = el.getAttribute('data-setting');
  if (sk) { var o = {}; o[sk] = el.type === 'checkbox' ? el.checked : el.value; saveSettings(o); toast('Saved'); return; }
  var t = S.openId ? byId(S.openId) : null;
  if (!t) return;
  if (el.getAttribute('data-act') === 'assign') {
    var v = el.value;
    patchTicket(t, {assigned:v}, [logEntry(v ? 'assigned the ticket to ' + v : 'unassigned the ticket')]);
  }
  if (el.getAttribute('data-act') === 'due') {
    var ts = fromLocalInput(el.value);
    patchTicket(t, {dueAt:ts}, [logEntry(ts ? 'set promised time to ' + dueText(ts) : 'cleared the promised time')]);
  }
  if (el.getAttribute('data-act') === 'warranty') {
    patchTicket(t, {warranty:el.value}, [logEntry('set warranty to ' + el.value)]);
  }
});

var qT;
document.addEventListener('input', function(e){
  if (e.target.id === 'q') {
    var el = e.target;
    S.q = el.value;
    clearTimeout(qT);
    qT = setTimeout(function(){ searchState = {s:el.selectionStart, e:el.selectionEnd}; render(); }, 120);
  }
});

document.addEventListener('submit', function(e){
  var f = e.target;
  if (f.getAttribute('data-form') === 'addpart') {
    e.preventDefault();
    var t = S.openId ? byId(S.openId) : null; if (!t) return;
    var n = $('#pn').value.trim(); if (!n) { $('#pn').focus(); return; }
    var sup = $('#ps').value; S.lastSupplier = sup;
    var part = {id:uid(), name:n.slice(0,80), supplier:sup, cost:num($('#pc2').value), status:'needed', orderNo:'', addedAt:Date.now()};
    $('#pn').value = ''; $('#pc2').value = '';
    patchTicket(t, {parts:(t.parts||[]).concat([part])}, [logEntry('added part “' + part.name + '” from ' + sup)]);
    return;
  }
  if (f.getAttribute('data-form') === 'addexp') {
    var ea = num($('#ex-amt').value); if (!ea) { toast('Enter an amount'); $('#ex-amt').focus(); return; }
    var ed = $('#ex-date').value ? parseDay($('#ex-date').value).getTime() + 12*3600e3 : Date.now();
    var eref = S.db.collection('expenses').doc(); var eo = {amt:ea, cat:$('#ex-cat').value, note:$('#ex-note').value.trim().slice(0,80), at:ed, by:who(), createdAt:Date.now()};
    S.exp = [Object.assign({id:eref.id}, eo)].concat(S.exp||[]); render();
    eref.set(eo).then(function(){ toast('Expense added'); }).catch(writeErr); return;
  }
  if (f.getAttribute('data-form') === 'addprice') {
    var pm = $('#pg-model').value.trim(), pf = num($('#pg-from').value);
    if (!pm || !pf) { toast('Enter a model and a starting price'); return; }
    var pl = ((S.pub||{}).prices||[]).concat([{model: pm.slice(0,40), repair: $('#pg-rep').value, from: pf}]);
    savePublic({prices: pl}); return;
  }
  if (f.getAttribute('data-form') === 'addtech') {
    e.preventDefault();
    var inp = $('#newtech'); var n = inp.value.trim().slice(0,30);
    if (!n) { inp.focus(); return; }
    var arr = (S.settings.techs||[]).slice();
    if (arr.some(function(x){ return x.toLowerCase() === n.toLowerCase(); })) { toast(n + ' is already on the team'); return; }
    arr.push(n); saveSettings({techs:arr}); toast(n + ' added');
  }
});

document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && S.openId && !document.querySelector('.modal')) closeSheet();
  if ((e.key === 'n' || e.key === 'N') && !e.metaKey && !e.ctrlKey && !e.altKey && !/input|textarea|select/i.test((document.activeElement||{}).tagName||'') && !document.querySelector('.modal') && !S.openId && S.status === 'ready' && S.canWrite) {
    e.preventDefault(); var kt = window.__lastKeyAt = Date.now();
    setTimeout(function(){ if (window.__lastKeyAt !== kt || document.querySelector('.modal') || S.openId) return; if (!S.me) whoBox(); else ticketForm(null); }, 150);
  }
});
document.addEventListener('keydown', function(e){ if (e.key && e.key.length === 1 && !(e.key === 'n' || e.key === 'N')) window.__lastKeyAt = Date.now(); else if (e.key === 'Enter') window.__lastKeyAt = Date.now(); }, true);

// keep "updated 5m ago" fresh
setInterval(function(){ if (S.status === 'ready' && !document.querySelector('.modal') && !(document.activeElement && document.activeElement.id === 'q')) render(); }, 60000);

})();
</script>
</body>
</html>
