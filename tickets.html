<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --white:#fff;--mist:#f5f5f7;--mist2:#ececf0;--ink:#1d1d1f;--graphite:#6e6e73;--line:#d2d2d7;--line2:#e5e5ea;
  --blue:#0071e3;--blue-h:#0077ed;--link:#0066cc;--green:#1a7f37;--red:#c9302c;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);color:var(--ink);background:var(--mist);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45;letter-spacing:-.01em;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
a{color:var(--link);text-decoration:none}
:focus-visible{outline:3px solid rgba(0,113,227,.45);outline-offset:2px;border-radius:8px}
.hidden{display:none!important}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.gate .card{background:#fff;border-radius:22px;box-shadow:0 10px 40px rgba(0,0,0,.08);padding:44px 36px;max-width:380px;width:100%;text-align:center}
.gate h1{font-size:28px;letter-spacing:-.02em;margin-bottom:6px}
.gate p{color:var(--graphite);margin-bottom:26px}
.gbtn{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:12px 22px;font-weight:600;font-size:15px}
.gbtn:hover{background:var(--mist)}
.gate .err{color:var(--red);margin-top:16px;font-size:14px;min-height:20px}
.muted{color:var(--graphite)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* top bar */
.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(0,0,0,.08)}
.top .tin{max-width:1920px;margin:0 auto;padding:0 clamp(16px,2.2vw,40px);height:58px;display:flex;align-items:center;gap:16px}
.brand{font-weight:700;font-size:19px;letter-spacing:-.035em;white-space:nowrap}
.brand span{color:var(--graphite);font-weight:500;margin-left:6px}
.tabs{display:flex;background:var(--mist);border-radius:10px;padding:3px;gap:2px}
.tabs button{border:0;background:transparent;padding:6px 14px;border-radius:8px;font-size:14px;color:var(--ink)}
.tabs button[aria-pressed="true"]{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.grow{flex:1}
.me{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px 5px 5px;font-size:14px;white-space:nowrap}
.av{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;background:var(--blue);color:#fff;border-radius:999px;padding:9px 18px;font-size:15px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--blue-h)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost:hover{background:var(--mist)}
.btn.dark{background:var(--ink)}
.btn.dark:hover{background:#000}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.danger{background:#fff;color:var(--red);box-shadow:inset 0 0 0 1px #f0c9c7}
.btn[disabled]{opacity:.5;cursor:default}
.link{border:0;background:none;color:var(--link);padding:0;font-size:inherit}
.link.red{color:var(--red)}
@media (max-width:820px){.tabs{display:none}.top .tin{gap:10px}.me .nm{display:none}.me{padding:4px}.newtxt{display:none}}

.wrap{max-width:1920px;margin:0 auto;padding:22px clamp(16px,2.2vw,40px) 120px}
.mtabs{display:none;margin-bottom:14px;overflow-x:auto;-webkit-overflow-scrolling:touch}
@media (max-width:820px){.mtabs{display:flex;scrollbar-width:none}.mtabs::-webkit-scrollbar{display:none}.mtabs.tabs button{flex:none;padding:6px 11px;font-size:13px}}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.stat{background:#fff;border-radius:var(--r);padding:16px 18px;border:0;text-align:left;width:100%}
.stk{display:grid;grid-template-columns:minmax(0,1.6fr) 120px 90px 90px auto;gap:12px;align-items:center;background:#fff;padding:10px 16px;border-bottom:1px solid var(--line2)}
.stk:first-child{border-radius:var(--r) var(--r) 0 0}.stk:last-child{border-radius:0 0 var(--r) var(--r);border-bottom:0}
.qty{display:inline-flex;align-items:center;gap:6px}.qty b{min-width:26px;text-align:center;font-size:16px}
.qty button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:16px;line-height:1}
.low{color:#b25000;font-weight:600}.out{color:var(--red);font-weight:600}
@media (max-width:820px){.stk{grid-template-columns:minmax(0,1fr) auto;gap:4px 10px}.stk .hide-s{display:none}}
.bb{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) 110px 110px auto;gap:12px;align-items:center;background:#fff;padding:12px 16px;border-bottom:1px solid var(--line2)}
@media (max-width:820px){.bb{grid-template-columns:minmax(0,1fr) auto;gap:4px 10px}.bb .hide-s{display:none}}
.pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.pic{aspect-ratio:1;border-radius:10px;background:var(--mist) center/cover no-repeat;border:0;position:relative}
.pic.add{display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:13px;color:var(--blue);border:1.5px dashed #b9d3f6;background:#f5f9ff;cursor:pointer}
.pic.add b{font-size:22px;line-height:1}
.apv{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line2);font-size:14px;flex-wrap:wrap}
.apv:last-child{border-bottom:0}
.stockpick{display:flex;gap:8px;margin-top:8px}
.mlist{display:flex;flex-direction:column;gap:8px}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
@media (max-width:900px){.board{grid-template-columns:1fr 1fr}}
.bcol{background:#ebebef;border-radius:var(--r);padding:10px;min-height:60vh}

.mbox{background:#fff;border-radius:20px;width:min(760px,100%);box-shadow:0 30px 80px rgba(0,0,0,.25);transform:translateY(12px);opacity:0;transition:transform .2s ease,opacity .2s ease}
.modal.on .mbox{transform:none;opacity:1}
.mbox.sm{width:min(440px,100%)}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line2)}
.mhead h2{font-size:21px;letter-spacing:-.025em}
.mbody{padding:18px 22px}
.msec{padding:6px 0 18px}
.msec+.msec{border-top:1px solid var(--line2);padding-top:18px}
.msec h3{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.msec h3 .n{width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;display:grid;place-items:center}
.mfoot{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:14px 22px;border-top:1px solid var(--line2);background:#fff;border-radius:0 0 20px 20px;flex:none}
.mbox.tall{display:flex;flex-direction:column;max-height:calc(100vh - 48px);max-height:calc(100dvh - 48px)}
.mbox.tall .mhead{flex:none}
.mbox.tall .mbody{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;min-height:0}
@media (max-width:620px){.modal.formm{padding:0}.modal.formm .mbox.tall{max-height:100vh;max-height:100dvh;height:100dvh;border-radius:0}.modal.formm .mfoot{border-radius:0;padding-bottom:calc(14px + env(safe-area-inset-bottom))}}
.irow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 110px 36px;gap:8px;margin-bottom:8px}
.irow .del{border:0;background:var(--mist);border-radius:10px;color:var(--graphite)}
@media (max-width:620px){.irow{grid-template-columns:minmax(0,1fr) minmax(0,1fr);}.irow .pr{grid-column:1}.irow .del{grid-column:2;height:42px}}
.hint{font-size:12.5px;color:var(--graphite);margin-top:6px}
.match{background:#e8f2ff;border-radius:10px;padding:10px 12px;font-size:13.5px;margin-top:10px}
.err{color:var(--red);font-size:13.5px;margin-right:auto}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.pick button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:18px 10px;font-size:16px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:10px}
.pick button:hover{border-color:var(--ink)}
.pick .av{width:44px;height:44px;font-size:17px}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:#fff;border-radius:999px;padding:10px 18px;font-size:14px;z-index:60;opacity:0;transition:all .2s ease;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.fab{display:none}
@media (max-width:820px){.fab{display:inline-flex;position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:25;box-shadow:0 8px 24px rgba(0,113,227,.35);padding:14px 20px;font-size:16px}}
.skel{height:64px;border-bottom:1px solid var(--line2);background:linear-gradient(90deg,#fff 0,#f5f5f7 50%,#fff 100%);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function dateOnly(t){ return new Date(t).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }

  if (!t) return '';
  var s = (Date.now() - t)/1000;
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s/60) + 'm ago';
  if (s < 86400) return Math.floor(s/3600) + 'h ago';
  var d = Math.floor(s/86400);
  if (d === 1) return 'yesterday';
  if (d < 7) return d + 'd ago';
  return new Date(t).toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
function sameDay(a, b){ var x = new Date(a), y = new Date(b); return x.getFullYear()===y.getFullYear() && x.getMonth()===y.getMonth() && x.getDate()===y.getDate(); }
function pill(k){ var s = SMAP[k] || SMAP['in']; return '<span class="pill" style="color:'+s.c+';background:'+s.bg+'"><i></i>'+esc(s.label)+'</span>'; }
function subtotal(t){ return r2((t.items||[]).reduce(function(a,i){ return a + (i.apvSt === 'pending' || i.apvSt === 'declined' ? 0 : num(i.price)); }, 0)); }
function discountAmt(t){ return Math.min(subtotal(t), num(t.discount)); }
function taxRateOf(t){ return t.taxExempt ? 0 : num(t.taxRate); }
function rHE(n){ // round to cents, half to even (same as Square)
  var x = Math.round(Number(n||0) * 100 * 1e6) / 1e6, f = Math.floor(x), d = Math.round((x - f) * 1e6) / 1e6;
  var c = d > 0.5 ? f + 1 : d < 0.5 ? f : (f % 2 === 0 ? f : f + 1);
  return c / 100;
}

      o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0 + 0.5);
    });
  } catch(e) {}
}

function startData(){
  var db = firebase.firestore();
  seenTickets = null; seenReqs = null; S.reqs = []; S.reqsErr = false;
  S.db = db; S.status = 'loading'; render();
  unsubs.push(db.collection('requests').orderBy('createdAt','desc').limit(300).onSnapshot(function(snap){
    S.reqs = snap.docs.map(function(d){ var o = clone(d.data()); o.id = d.id; return o; });

      snap.docChanges().forEach(function(ch){
        if (ch.type !== 'added' || seenReqs[ch.doc.id] || ch.doc.metadata.hasPendingWrites) return;
        var r = ch.doc.data() || {};
        if (r.kind === 'sell') alertNew('Someone wants to sell a phone', (r.device||'') + ' · ' + (r.repair||''), function(){ S.view='bookings'; render(); });
        else if (r.kind === 'checkin') alertNew('Online check-in · ' + (r.whenText||''), (r.name||'') + ' · ' + (r.device||'') + ' · ' + (r.repair||''), function(){ S.view='bookings'; render(); });
        else if (r.kind === 'business') alertNew('New school / business request', (r.org||'') + ' · ' + (r.name||''), function(){ S.view='bookings'; render(); });
        else if (r.kind === 'quote') alertNew('New quote request', (r.device||'') + (r.notes ? ' — ' + r.notes.slice(0,80) : ''), function(){ S.view='bookings'; render(); });
        else alertNew(r.where === 'mobile' ? 'New MOBILE booking' : 'New shop booking', (r.whenText||'') + '\n' + (r.name||'') + ' · ' + (r.device||'') + ' · ' + (r.repair||''), function(){ S.view='bookings'; render(); });
      });

    render();
  }, function(){ S.reqsErr = true; render(); }));
  unsubs.push(db.collection('inventory').onSnapshot(function(snap){ S.inv = snap.docs.map(function(d){ var o = clone(d.data()); o.id = d.id; return o; }); render(); }, function(){}));
  unsubs.push(db.collection('buybacks').orderBy('createdAt','desc').limit(500).onSnapshot(function(snap){ S.bb = snap.docs.map(function(d){ var o = clone(d.data()); o.id = d.id; return o; }); render(); }, function(){}));

  }, function(){}));

  unsubs.push(db.collection('expenses').orderBy('at','desc').limit(1500).onSnapshot(function(snap){ S.exp = snap.docs.map(function(d){ var o = clone(d.data()); o.id = d.id; return o; }); render(); }, function(){}));
  unsubs.push(db.collection('clock').orderBy('in','desc').limit(400).onSnapshot(function(snap){ S.clock = snap.docs.map(function(d){ var o = clone(d.data()); o.id = d.id; return o; }); render(); }, function(){}));
  unsubs.push(db.doc('public/site').onSnapshot(function(snap){ S.pub = snap.exists ? clone(snap.data()) : {}; render(); }, function(){}));
  unsubs.push(db.collection('avail').onSnapshot(function(snap){
    var o = {}; snap.docs.forEach(function(d){ o[d.id] = clone(d.data()); }); S.avail = o; render();
  }, function(){}));
  unsubs.push(db.collection('tickets').orderBy('createdAt','desc').limit(2000).onSnapshot({includeMetadataChanges:true}, function(snap){
    S.tickets = snap.docs.map(function(d){ var o = clone(d.data()); o.id = d.id; return o; });
    if (seenTickets && !snap.metadata.fromCache) {
      snap.docChanges().forEach(function(ch){
        if (ch.type !== 'added' || seenTickets[ch.doc.id] || ch.doc.metadata.hasPendingWrites) return;
        var t = ch.doc.data() || {};
        if ((t.createdAt||0) < BOOT) return;
        alertNew('New ticket #' + t.num, (t.customer && t.customer.name || '') + ' · ' + (t.device && t.device.model || '') + (t.createdBy ? ' · by ' + t.createdBy : ''), function(){ openTicket(ch.doc.id); });

function matches(t, q){
  if (!q) return true;
  var hay = [t.num, t.customer && t.customer.name, t.customer && digits(t.customer.phone), t.device && t.device.model, t.device && t.device.imei, repairsText(t), t.assigned].join(' ').toLowerCase();
  return q.toLowerCase().split(/\s+/).every(function(w){
    if (!w) return true;
    var d = digits(w);
    return hay.indexOf(w.replace(/^#/,'')) > -1 || (d.length >= 3 && hay.indexOf(d) > -1);
  });
}

var RP = 'today';
function reportsView(){

  else { start = Date.now() - 30*86400000; }

  var paid = S.tickets.filter(function(t){ return t.paid && inR(t.paidAt); });
  var revenue = paid.reduce(function(a,t){ return a + netSales(t); }, 0), taxC = paid.reduce(function(a,t){ return a + allTax(t); }, 0), surC = paid.reduce(function(a,t){ return a + cardFees(t); }, 0);

  var done = S.tickets.filter(function(t){ return t.status === 'done' && inR(t.pickedUpAt); });

  var turnTxt = !done.length ? '—' : turn < 3600e3 ? Math.max(1, Math.round(turn/60000)) + ' min' : turn < 86400e3 ? (Math.round(turn/360000)/10) + ' hrs' : (Math.round(turn/8640000)/10) + ' days';

  var tiles = '<div class="rgrid">' +
    '<div class="stat"><b>'+money(revenue)+'</b><span>Sales (before tax)</span></div>' +
    '<div class="stat"><b>'+money(revenue - pcost)+'</b><span>After part costs</span></div>' +
    '<div class="stat"><b>'+money(taxC)+'</b><span>Sales tax collected'+(surC?' · '+money(surC)+' card surcharges':'')+'</span></div>' +
    '<div class="stat"><b>'+created+'</b><span>New tickets</span></div>' +
    '<div class="stat"><b>'+done.length+'</b><span>Picked up</span></div>' +
    '<div class="stat"><b>'+turnTxt+'</b><span>Average check-in to pickup</span></div>' +
  '</div>';
  var byTech = {};
  var tk = function(k){ return byTech[k] || (byTech[k] = {n:0, rev:0, tsum:0, tn:0, wr:0}); };
  done.forEach(function(t){ var o = tk(t.assigned || 'Unassigned'); o.n++; if (t.paid) o.rev += netSales(t); var ra = readyAt(t); if (ra && ra > t.createdAt) { o.tsum += ra - t.createdAt; o.tn++; } });
  S.tickets.filter(function(t){ return t.warrantyReturn && inR(t.createdAt); }).forEach(function(t){
    var prev = S.tickets.filter(function(x){ return x.id !== t.id && x.status === 'done' && x.createdAt < t.createdAt && digits(x.customer&&x.customer.phone) === digits(t.customer&&t.customer.phone); }).sort(function(a,b){ return b.createdAt - a.createdAt; })[0];
    tk((prev && prev.assigned) || t.assigned || 'Unassigned').wr++;
  });
  var dur = function(ms){ return !ms ? '—' : ms < 3600e3 ? Math.max(1, Math.round(ms/60000)) + ' min' : ms < 86400e3 ? (Math.round(ms/360000)/10) + ' hrs' : (Math.round(ms/8640000)/10) + ' days'; };
  var techRows = Object.keys(byTech).sort(function(a,b){ return byTech[b].n - byTech[a].n; });
  var maxN = techRows.reduce(function(m,k){ return Math.max(m, byTech[k].n); }, 1);
  var techTbl = techRows.length ? '<div style="overflow-x:auto"><table class="rtable"><thead><tr><th>Technician</th><th>Repairs</th><th></th><th>Avg time to ready</th><th>Warranty returns</th><th class="right">Sales</th><th class="right">Commission</th></tr></thead><tbody>' + techRows.map(function(k){
    var o = byTech[k];
    return '<tr><td>'+esc(k)+'</td><td style="width:70px">'+o.n+'</td><td style="min-width:80px"><div class="barw"><i style="width:'+Math.round(o.n/maxN*100)+'%"></i></div></td><td>'+dur(o.tn ? o.tsum/o.tn : 0)+'</td><td'+(o.wr?' style="color:var(--red);font-weight:600"':'')+'>'+o.wr+'</td><td class="right amt">'+money(o.rev)+'</td><td class="right amt">'+(commPct(k)?money(r2(o.rev*commPct(k)/100))+' <span class="t2">('+commPct(k)+'%)</span>':'<span class="t2">—</span>')+'</td></tr>';
  }).join('') + '</tbody></table></div>' : '<p class="muted">No repairs picked up in this period.</p>';
  var rep = {};
  S.tickets.filter(function(t){ return inR(t.createdAt); }).forEach(function(t){ (t.items||[]).forEach(function(i){ var k = ((i.repair === 'Other repair' || i.repair === 'Other') ? 'Other repair' : i.repair) + (i.part ? ' · ' + i.part : ''); rep[k] = (rep[k]||0) + 1; }); });
  var repRows = Object.keys(rep).sort(function(a,b){ return rep[b]-rep[a]; }).slice(0,8);
  var maxR = repRows.reduce(function(m,k){ return Math.max(m, rep[k]); }, 1);
  var repTbl = repRows.length ? '<table class="rtable"><tbody>' + repRows.map(function(k){ return '<tr><td>'+esc(k)+'</td><td style="width:45%"><div class="barw"><i style="width:'+Math.round(rep[k]/maxR*100)+'%"></i></div></td><td class="right" style="width:40px">'+rep[k]+'</td></tr>'; }).join('') + '</tbody></table>' : '<p class="muted">No tickets in this period.</p>';
  var pm = {};
  paid.forEach(function(t){ var o = byMethod(t); Object.keys(o).forEach(function(k){ pm[k] = r2((pm[k]||0) + o[k]); }); });
  var pmTbl = Object.keys(pm).length ? '<table class="rtable"><tbody>' + Object.keys(pm).map(function(k){ return '<tr><td>'+esc(k)+'</td><td class="right amt">'+money(pm[k])+'</td></tr>'; }).join('') + '</tbody></table>' : '<p class="muted">No payments in this period.</p>';
  return seg + tiles +
    (RP === 'today' ? closeoutPanel() : '') +
    '<div class="rgrid" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="stat"><b>'+money(revenue - pcost)+'</b><span>After part costs</span></div><div class="stat"><b>'+money((S.exp||[]).filter(function(x){ return x.at >= start; }).reduce(function(a,x){ return a + num(x.amt); }, 0))+'</b><span>Expenses</span></div><div class="stat"><b style="color:var(--green)">'+money(revenue - pcost - (S.exp||[]).filter(function(x){ return x.at >= start; }).reduce(function(a,x){ return a + num(x.amt); }, 0))+'</b><span>Real profit (after parts and expenses)</span></div></div>' +
    expensesPanel(start) + clockPanel() +

    '<div class="g2"><div class="panel"><h2>Most common repairs</h2><p class="d">From tickets checked in this period.</p>'+repTbl+'</div>' +
    '<div class="panel"><h2>Payments</h2><p class="d">By payment method.</p>'+pmTbl+'</div></div>' +
    '<p class="muted" style="font-size:13px">“Sales” and “After part costs” don’t include sales tax (that money goes to Texas). “After part costs” uses the part costs entered on tickets.</p>';
}

/* ---------- QR ---------- */
function qrSvg(text, px){
  try {
    var q = qrcode(0, 'M'); q.addData(text); q.make();
    var n = q.getModuleCount(), cell = (px || 96) / (n + 2), r = '';
    for (var y = 0; y < n; y++) for (var x = 0; x < n; x++) if (q.isDark(y, x)) r += 'M' + ((x+1)*cell).toFixed(2) + ' ' + ((y+1)*cell).toFixed(2) + 'h' + cell.toFixed(2) + 'v' + cell.toFixed(2) + 'h-' + cell.toFixed(2) + 'z';
    return '<svg xmlns="http://www.w3.org/2000/svg" width="'+px+'" height="'+px+'" viewBox="0 0 '+px+' '+px+'"><rect width="100%" height="100%" fill="#fff"/><path d="'+r+'" fill="#000"/></svg>';
  } catch(e) { return ''; }
}

    var oledOnly = /iPhone (1[7-9]|2\d)|iPhone Air|iPhone Duo/.test(m) && !/\d+e\b/.test(m);
    var oled = oledOnly || /(1[3-9]|2\d) Pro/.test(m);
    return (oledOnly ? [] : ['Screen · Incell']).concat(oled ? ['Screen · OLED'] : []).concat(['Screen · Original','Battery','Charging port']).concat(/iPhone [78]\b|iPhone 7 Plus/.test(m) ? [] : ['Back glass']).concat(['Rear camera']);
  }
  if (brand === 'Apple iPad' || /Tab/.test(m)) return ['Screen / digitizer','LCD','Battery','Charging port'];
  if (/Fold/.test(m)) return ['Inner screen','Outer screen','Battery','Charging port','Back glass'];
  return ['Screen','Battery','Charging port','Back glass','Rear camera'];
}
function stockId(brand, model, part){ return (brand + '-' + model + '-' + part).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 140); }
function invById(id){ return (S.inv||[]).filter(function(x){ return x.id === id; })[0]; }

    if (S.stockOnly) list = list.filter(function(x){ return inv.some(function(i){ return i.brand === x.b && i.model === x.m && num(i.qty) > 0; }); });

function shrink(file){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onload = function(){
      var im = new Image();
      im.onload = function(){
        var tries = [[1280,0.72],[1024,0.65],[800,0.6]];
        for (var i = 0; i < tries.length; i++) {
          var sc = Math.min(1, tries[i][0] / Math.max(im.width, im.height)), c = document.createElement('canvas');
          c.width = Math.round(im.width * sc); c.height = Math.round(im.height * sc);
          c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
          var d = c.toDataURL('image/jpeg', tries[i][1]);
          if (d.length < 700000 || i === tries.length - 1) return res(d);
        }
      };
      im.onerror = function(){ rej(new Error('img')); };
      im.src = fr.result;
    };
    fr.onerror = function(){ rej(new Error('read')); };
    fr.readAsDataURL(file);
  });
}
function addPhotos(t, files){
  files = Array.prototype.slice.call(files||[], 0, 8 - (t.photos||[]).length);
  if (!files.length) return;
  toast('Saving ' + files.length + ' photo' + (files.length>1?'s':'') + '…');
  Promise.all(files.map(shrink)).then(function(datas){
    var live = byId(t.id) || t, list = (live.photos||[]).slice(), now = Date.now();
    var b = S.db.batch();
    datas.forEach(function(d, i){ var k = (now + i).toString(36); list.push({k:k, at:now, by:who()}); S.photoCache[t.id + '_' + k] = d; b.set(S.db.doc('photos/' + t.id + '_' + k), {tid:t.id, data:d, at:now, by:who()}); });
    return retryOnce(function(){ return b.commit(); }).then(function(){ patchTicket(live, {photos:list}, [logEntry('added ' + datas.length + ' photo' + (datas.length>1?'s':''))]); toast('Photos saved'); });
  }).catch(function(e){ if (e && e.code) writeErr(e); else toast('Couldn’t read that photo. Try another.'); });
}

function setPartStatus(t, pid, v, orderNo){
  var parts = clone(t.parts||[]); var p = parts.filter(function(x){ return x.id === pid; })[0]; if (!p || p.status === v) return;
  p.status = v;
  if (v === 'ordered') { p.orderedAt = Date.now(); if (orderNo) p.orderNo = orderNo; }
  if (v === 'arrived') p.arrivedAt = Date.now();
  if (v === 'used') p.usedAt = Date.now();
  var fields = {parts:parts};
  var logs = [logEntry('marked part “' + p.name + '” ' + PSMAP[v].toLowerCase() + (v==='ordered' && orderNo ? ' (order ' + orderNo + ')' : ''))];
  if (v === 'ordered' && t.status === 'in') { fields.status = 'part'; logs.push(logEntry('changed status to Waiting on part')); }
  patchTicket(t, fields, logs);
  if (v === 'arrived' && t.status === 'part' && !openParts({parts:parts}).length) toast('All parts are in for #' + t.num);
}

/* ---------- status / actions ---------- */
async function setStatus(t, k){
  if (t.status === k) return;
  if (k === 'done' && !t.paid && balance(t) > 0) {
    var ok = await confirmBox('Mark as picked up?', 'This ticket still shows ' + money(balance(t)) + ' unpaid. Mark it picked up anyway?', 'Picked up, unpaid');
    if (!ok) return;
  }
  if (k === 'cancel') {
    var ok2 = await confirmBox('Cancel this ticket?', 'The ticket stays in your history as Cancelled. The passcode will be deleted.', 'Cancel ticket', true);
    if (!ok2) return;
  }
  var fields = {status:k};
  var logs = [logEntry('changed status to ' + SMAP[k].label)];
  if (k === 'done') fields.pickedUpAt = Date.now();
  if ((k === 'done' || k === 'cancel') && t.device && t.device.passcode) {
    fields.device = Object.assign({}, t.device, {passcode:''});
    logs.push(logEntry('deleted the passcode'));
  }
  patchTicket(t, fields, logs);
  toast(SMAP[k].label);
}

function confirmBox(title, text, okLabel, danger){
  return new Promise(function(resolve){
    var m = document.createElement('div');
    m.className = 'modal'; m.setAttribute('role','dialog'); m.setAttribute('aria-modal','true');
    m.innerHTML = '<div class="scrim on" style="position:fixed"></div><div class="mbox sm" style="position:relative;z-index:41;margin-top:12vh"><div class="mbody"><h2 style="font-size:20px;letter-spacing:-.02em;margin-bottom:6px">'+esc(title)+'</h2><p class="muted">'+esc(text)+'</p></div>' +
      '<div class="mfoot"><button class="btn ghost" data-r="0">Go back</button><button class="btn '+(danger?'danger':'')+'" data-r="1">'+esc(okLabel)+'</button></div></div>';
    document.body.appendChild(m);
    requestAnimationFrame(function(){ m.classList.add('on'); var b0 = $('[data-r="1"]', m); if (b0) b0.focus(); });
    function done(v){ m.remove(); document.removeEventListener('keydown', key, true); resolve(v); }
    function key(e){ if (e.key === 'Escape') { e.stopPropagation(); done(false); } }
    document.addEventListener('keydown', key, true);
    m.addEventListener('click', function(e){
      var b = e.target.closest('[data-r]'); if (b) done(b.getAttribute('data-r') === '1');
      else if (e.target.classList.contains('scrim')) done(false);
    });
  });
}

function submitForm(t, m, closeForm){
  syncItems();
  var err = $('#tf-err'); err.textContent = '';
  var phone = $('#tf-phone').value.trim(), name = $('#tf-name').value.trim(), model = $('#tf-model').value.trim();
  var bad = [];
  if (digits(phone).length < 10) bad.push('tf-phone');
  if (!name) bad.push('tf-name');
  if (!model) bad.push('tf-model');
  if (NT.type === 'mobile' && !$('#tf-addr').value.trim()) bad.push('tf-addr');
  bad.forEach(function(id){ $('#'+id).classList.add('bad'); });
  if (bad.length) { err.textContent = digits(phone).length && digits(phone).length < 10 ? 'Enter a 10-digit phone number.' : 'Fill in the highlighted fields.'; $('#'+bad[0]).focus(); return; }
  if (!t && !$('#tf-agree').checked) { err.textContent = 'Confirm the customer agreed to the repair policy.'; $('#tf-agree').focus(); return; }

  var needDesc = NT.items.filter(function(i){ return (i.repair === 'Other repair' || i.repair === 'Other') && !String(i.desc||'').trim(); });
  if (needDesc.length) { var di = NT.items.indexOf(needDesc[0]); var de = $('#it-d' + di); if (de) { de.classList.add('bad'); de.focus(); } err.textContent = 'Describe the “Other repair”.'; return; }
  var items = NT.items.filter(function(i){ return i.repair; }).map(function(i){ var o = {repair:i.repair, part:i.part||'', price: i.price === '' ? '' : num(i.price)}; if ((i.repair === 'Other repair' || i.repair === 'Other') && i.desc) o.desc = String(i.desc).trim().slice(0,120); return o; });
  var data = {
    type: NT.type,
    address: NT.type === 'mobile' ? $('#tf-addr').value.trim() : '',
    customer: {name:name, phone:fmtPhone(phone), address:$('#tf-addr').value.trim(), email:$('#tf-email').value.trim()},
    device: {brand:$('#tf-brand').value || guessBrand(model), model:model, color:$('#tf-color').value.trim(), imei:$('#tf-imei').value.trim(), passcode:$('#tf-pc').value.trim()},
    items: items,
    deposit: num($('#tf-dep').value),
    depMethod: num($('#tf-dep').value) ? $('#tf-depm').value : '',
    depSurcharge: num($('#tf-dep').value) && CARDISH.indexOf($('#tf-depm').value) > -1 ? cardFee(num($('#tf-dep').value), $('#tf-tex').checked ? 0 : NT.taxRate).all : 0,
    depSurTax: num($('#tf-dep').value) && CARDISH.indexOf($('#tf-depm').value) > -1 ? cardFee(num($('#tf-dep').value), $('#tf-tex').checked ? 0 : NT.taxRate).tax : 0,
    discount: num($('#tf-disc').value),
    discountNote: $('#tf-discn').value.trim().slice(0,40),
    taxExempt: $('#tf-tex').checked,
    taxRate: NT.taxRate,
    assigned: $('#tf-tech').value,
    warranty: $('#tf-war').value,
    pre: m._pre,
    damage: $('#tf-dmg').value.trim(),
    liquid: $('#tf-liq').checked,
    dueAt: fromLocalInput($('#tf-due').value),
    warrantyReturn: $('#tf-wret').checked
  };
  var btn = $('#tf-save'); btn.disabled = true; btn.textContent = 'Saving…';

  if (t) {
    var live = byId(t.id); if (!live) { closeForm(); return; }
    var oldK = pubKey(live);
    patchTicket(live, data, [logEntry('edited the ticket details')]);
    syncStatusSoon(live, oldK);
    closeForm(); toast('Saved');
    return;
  }
  var now = Date.now();
  var body = Object.assign(data, {
    num: nextNum(), status:'in', createdAt:now, updatedAt:now, createdBy:who(),
    paid:false, payMethod:'', paidAt:0, agreed:true, post:{}, parts:[],
    sig: (m._sig && m._sig.has()) ? m._sig.data() : '', sigAt: (m._sig && m._sig.has()) ? now : 0,
    log:[logEntry('checked in the device')].concat(data.assigned ? [logEntry('assigned the ticket to ' + data.assigned)] : [])
  });
  var reqId = NT.reqId;
  var ref = S.db.collection('tickets').doc();
  retryOnce(function(){ return ref.set(body); }).then(function(){
    var sb = clone(body); sb.id = ref.id; syncStatus(sb);
    if (!byId(ref.id)) { var loc = clone(body); loc.id = ref.id; S.tickets.unshift(loc); }
    closeForm(); toast('Ticket #' + body.num + ' created');
    S.filter = 'active'; S.q = ''; S.view = 'tickets'; render();
    openTicket(ref.id);
    if (reqId) patchReq(reqId, {status:'done', ticketId: ref.id, ticketNum: body.num});
    if (S.settings.pushTickets !== false) pushPhone('New ticket #' + body.num, (body.customer.name||'') + ' · ' + (body.device.model||'') + ' · ' + repairsText(body) + ' · by ' + who());
    if (S.settings.autoLabel) { var nt2 = byId(ref.id); if (nt2) setTimeout(function(){ printLabel(nt2); }, 400); }
  }).catch(function(e){
    btn.disabled = false; btn.textContent = 'Check in';
    if (e && e.code === 'resource-exhausted') err.textContent = 'Storage is full. Export and delete old tickets in Settings.';
    else if (e && e.code === 'permission-denied') { err.textContent = 'No permission. Sign in with the shop account.'; }
    else err.textContent = 'Couldn’t save. Check your connection and try again.';
  });
}

function printHtml(html){
  var old = document.getElementById('printframe'); if (old) old.remove();
  var f = document.createElement('iframe');
  f.id = 'printframe'; f.setAttribute('aria-hidden','true');
  f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden';
  document.body.appendChild(f);
  var d = f.contentWindow.document; d.open(); d.write(html); d.close();
  var go = function(){ try { f.contentWindow.focus(); f.contentWindow.print(); } catch(e) { toast('Couldn’t open the printer.'); } };
  var imgs = d.images, left = imgs.length;
  if (!left) setTimeout(go, 150);
  else Array.prototype.forEach.call(imgs, function(im){ if (im.complete) { if (!--left) setTimeout(go, 150); } else { im.onload = im.onerror = function(){ if (!--left) setTimeout(go, 150); }; } });
}

/* signature pad */
function sigPad(box, onSign){
  if (!box) return null;
  var cv = box.querySelector('canvas'), ctx = cv.getContext('2d'), drawing = false, has = false, last = null;
  function size(){
    var r = box.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    var img = has ? cv.toDataURL() : null;
    cv.width = Math.max(1, Math.round(r.width * dpr)); cv.height = Math.max(1, Math.round(r.height * dpr));
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1d1d1f';
    if (img) { var im = new Image(); im.onload = function(){ ctx.drawImage(im, 0, 0, r.width, r.height); }; im.src = img; }
  }
  requestAnimationFrame(size);
  function pt(e){ var r = cv.getBoundingClientRect(); return {x:e.clientX - r.left, y:e.clientY - r.top}; }
  cv.addEventListener('pointerdown', function(e){ e.preventDefault(); drawing = true; last = pt(e); try { cv.setPointerCapture(e.pointerId); } catch(x) {} ctx.beginPath(); ctx.arc(last.x, last.y, 1.1, 0, Math.PI*2); ctx.fillStyle = '#1d1d1f'; ctx.fill(); mark(); });
  cv.addEventListener('pointermove', function(e){ if (!drawing) return; var p = pt(e); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p; });
  ['pointerup','pointercancel','pointerleave'].forEach(function(ev){ cv.addEventListener(ev, function(){ drawing = false; }); });
  function mark(){ if (!has) { has = true; box.classList.add('has'); if (onSign) onSign(); } }
  return {
    has: function(){ return has; },
    clear: function(){ ctx.clearRect(0, 0, cv.width, cv.height); has = false; box.classList.remove('has'); },
    data: function(){
      // shrink to a small PNG on white
      var w = 480, h = Math.round(w * cv.height / cv.width), o = document.createElement('canvas'); o.width = w; o.height = h;
      var c2 = o.getContext('2d'); c2.fillStyle = '#fff'; c2.fillRect(0,0,w,h); c2.drawImage(cv, 0, 0, w, h);
      return o.toDataURL('image/png');
    }
  };
}
function signBox(t){
  var m = document.createElement('div');
  m.className = 'modal'; m.setAttribute('role','dialog'); m.setAttribute('aria-modal','true'); m.setAttribute('aria-labelledby','sg-t');
  m.innerHTML = '<div class="scrim on" style="position:fixed" data-sg-close></div><div class="mbox" style="position:relative;z-index:41;width:min(620px,100%);margin-top:8vh"><div class="mhead"><h2 id="sg-t">Customer signature · #'+esc(t.num)+'</h2><button class="x" data-sg-close aria-label="Close">✕</button></div><div class="mbody">' +
    '<p class="muted" style="margin-bottom:12px">I agree to the iFixPhones Warranty and Repair Policy and approve the repairs on this ticket: <b>'+esc(repairsText(t))+'</b>'+(total(t)?' · '+money(total(t)):'')+'.</p>' +
    '<div class="sigpad" id="sg-pad" style="height:190px"><div class="ln"></div><canvas></canvas><div class="ph">Sign here</div></div>' +
    '<div class="sigbar"><span>'+esc((t.customer||{}).name||'')+'</span><button type="button" class="link" data-sg-clear>Clear</button></div>' +
    '</div><div class="mfoot"><span class="err" id="sg-err" role="alert"></span><button class="btn ghost" data-sg-close>Cancel</button><button class="btn" data-sg-save>Save signature</button></div></div>';
  document.body.appendChild(m);
  var pad = sigPad($('#sg-pad', m));
  requestAnimationFrame(function(){ m.classList.add('on'); });
  m.addEventListener('click', function(e){
