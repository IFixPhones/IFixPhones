<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check my repair | iFixPhones</title>
<meta name="description" content="Check the status of your iFixPhones repair with your ticket number.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--mist:#f5f5f7;--ink:#1d1d1f;--graphite:#6e6e73;--blue:#0071e3;--green:#1a7f37;--line:#d2d2d7;--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);color:var(--ink);background:var(--mist);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;min-height:100vh}
a{color:#0066cc;text-decoration:none}
.nav{background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(0,0,0,.08)}
.nav .w{display:flex;align-items:center;justify-content:space-between;height:52px}
.brand{font-weight:600;font-size:18px;color:var(--ink)}
.w{max-width:620px;margin:0 auto;padding:0 22px}
h1{font-size:clamp(34px,7vw,48px);letter-spacing:-.03em;line-height:1.05;margin-top:48px;text-align:center}
.lede{font-size:19px;color:var(--graphite);text-align:center;margin-top:10px}
.card{background:#fff;border-radius:22px;padding:26px;margin-top:28px;box-shadow:0 2px 20px rgba(0,0,0,.04)}
.fields{display:grid;grid-template-columns:1.2fr 1fr;gap:12px}
@media (max-width:480px){.fields{grid-template-columns:1fr}}
.field{position:relative}
.field input{width:100%;font:inherit;font-size:17px;background:#fff;border:1px solid #86868b;border-radius:12px;padding:25px 14px 8px;outline:none;min-height:58px}
.field label{position:absolute;left:15px;top:8px;font-size:12px;color:var(--graphite)}
.field input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,113,227,.2)}
.btn{display:inline-flex;align-items:center;justify-content:center;border:0;background:var(--blue);color:#fff;border-radius:999px;padding:13px 26px;font:inherit;font-size:17px;font-weight:500;cursor:pointer;width:100%;margin-top:14px}
.btn:disabled{opacity:.6}
.err{color:#c9302c;margin-top:12px;font-size:15px}
.hidden{display:none!important}
.res h2{font-size:24px;letter-spacing:-.02em}
.res .dev{color:var(--graphite);margin-top:4px}
.badge{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:7px 14px;font-weight:600;font-size:15px;margin-top:16px}
.badge i{width:8px;height:8px;border-radius:50%;background:currentColor}
.steps{display:flex;gap:6px;margin-top:22px}
.steps div{flex:1;text-align:center;font-size:12px;color:var(--graphite)}
.steps div b{display:block;height:6px;border-radius:3px;background:#e5e5ea;margin-bottom:8px}
.steps div.on b{background:var(--blue)}.steps div.cur{color:var(--ink);font-weight:600}
.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid #ececf0;font-size:15px}
.row span:first-child{color:var(--graphite)}
.note{background:#fff8e6;border-radius:12px;padding:12px 14px;margin-top:16px;font-size:15px}
.acts{display:flex;gap:10px;margin-top:18px}
.acts a{flex:1;text-align:center;border:1px solid var(--line);border-radius:999px;padding:11px;font-weight:500;color:var(--ink)}
.foot{text-align:center;color:var(--graphite);font-size:13px;margin:36px 0 40px}
</style>
</head>
<body>
<nav class="nav"><div class="w"><a class="brand" href="/">iFixPhones</a><a href="tel:+12107733548">Call</a></div></nav>
<main class="w">
  <h1>Check my repair.</h1>
  <p class="lede">Enter your ticket number and the last 4 digits of your phone number.</p>

  <form class="card" id="f" novalidate>
    <div class="fields">
      <div class="field"><label for="n">Ticket number</label><input id="n" inputmode="numeric" autocomplete="off" placeholder="1001"></div>
      <div class="field"><label for="p">Last 4 of your phone</label><input id="p" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="0123"></div>
    </div>
    <p class="err hidden" id="err" role="alert"></p>
    <button class="btn" id="go" type="submit">Check status</button>
  </form>

  <div class="card res hidden" id="res" aria-live="polite"></div>

  <p class="foot">Questions? Call <a href="tel:+12107733548">(210) 773-3548</a> or text <a href="sms:+12107733548">(210) 773-3548</a>.<br>iFixPhones · 9055 Marbach Rd, Suite 105, San Antonio, TX</p>
</main>
<script>
(function(){
  var BASE = 'https://firestore.googleapis.com/v1/projects/ifixphones-ca10e/databases/(default)/documents/status/';
  var KEY = 'AIzaSyADty-4Af9uDsTSY5MDUr0pfDlSF3HS9DI';
  var ST = {
    'in':{t:'Checked in', c:'#515154', bg:'#ececf0', i:0, msg:'We have your device and it’s in line for repair.'},
    'part':{t:'Waiting on a part', c:'#a04a00', bg:'#fff1e0', i:1, msg:'We ordered a part for your repair. We’ll get started as soon as it arrives.'},
    'repair':{t:'Being repaired', c:'#0058b0', bg:'#e6f0fc', i:2, msg:'A technician is working on your device now.'},
    'ready':{t:'Ready for pickup', c:'#14692c', bg:'#e5f5ea', i:3, msg:'All done! Come pick it up any time we’re open.'},
    'done':{t:'Picked up', c:'#1d1d1f', bg:'#f2f2f4', i:4, msg:'This repair is complete. Thanks for choosing iFixPhones!'},
    'cancel':{t:'Closed', c:'#9b2c27', bg:'#fbeceb', i:-1, msg:'This ticket was closed. Call us if you have questions.'}
  };
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function money(n){ n = Number(n)||0; return '$' + (Math.round(n*100) % 100 ? n.toFixed(2) : String(Math.round(n))); }
  function val(f){ if (!f) return ''; if ('stringValue' in f) return f.stringValue; if ('integerValue' in f) return Number(f.integerValue); if ('doubleValue' in f) return f.doubleValue; if ('booleanValue' in f) return f.booleanValue; return ''; }
  function when(ts){ var d = new Date(ts); return d.toLocaleString('en-US',{weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit'}); }
  function err(m){ var e = $('err'); e.textContent = m; e.classList.toggle('hidden', !m); }

  function lookup(){
    var n = $('n').value.replace(/\D/g,''), p = $('p').value.replace(/\D/g,'');
    err('');
    if (!n) { err('Enter your ticket number. It’s on your receipt.'); $('n').focus(); return; }
    if (p.length !== 4) { err('Enter the last 4 digits of the phone number on the ticket.'); $('p').focus(); return; }
    var b = $('go'); b.disabled = true; b.textContent = 'Checking…';
    fetch(BASE + n + '_' + p + '?key=' + KEY, {cache:'no-store'}).then(function(r){
      if (r.status === 404 || r.status === 403) return null;
      if (!r.ok) throw new Error('net');
      return r.json();
    }).then(function(j){
      b.disabled = false; b.textContent = 'Check status';
      if (!j) { $('res').classList.add('hidden'); err('We couldn’t find that ticket. Double-check the number on your receipt, or call us.'); return; }
      var f = j.fields || {}, st = ST[val(f.st)] || ST['in'];
      var steps = ['Checked in','Part','Repairing','Ready','Picked up'].map(function(l, i){ return '<div class="'+(st.i >= i ? 'on' : '')+(st.i === i ? ' cur' : '')+'"><b></b>'+l+'</div>'; }).join('');
      var rows = '';
      if (val(f.rep)) rows += '<div class="row"><span>Repair</span><span>'+esc(val(f.rep))+'</span></div>';
      if (val(f.due)) rows += '<div class="row"><span>Expected ready</span><span>'+esc(when(val(f.due)))+'</span></div>';
      if (val(f.bal)) rows += '<div class="row"><span>Balance due at pickup</span><span><b>'+money(val(f.bal))+'</b></span></div>';
      if (val(f.upd)) rows += '<div class="row"><span>Last update</span><span>'+esc(when(val(f.upd)))+'</span></div>';
      $('res').innerHTML = '<h2>Ticket #'+esc(val(f.n))+'</h2><div class="dev">'+esc(val(f.dev))+(val(f.mobile)?' · Mobile repair':'')+'</div>' +
        '<div class="badge" style="color:'+st.c+';background:'+st.bg+'"><i></i>'+st.t+'</div>' +
        (st.i >= 0 ? '<div class="steps">'+steps+'</div>' : '') +
        '<p style="margin-top:16px">'+st.msg+'</p>' +
        (val(f.wait) ? '<div class="note">We sent you a text about extra work that needs your OK. Check your messages.</div>' : '') +
        (val(f.st) === 'ready' && !val(f.mobile) ? '<div class="note" style="background:#e5f5ea">Pick up at 9055 Marbach Rd, Suite 105. Open Mon–Sat 10 AM–8 PM, Sun 12–6 PM.</div>' : '') +
        '<div style="margin-top:14px">'+rows+'</div>' +
        '<div class="acts"><a href="tel:+12107733548">Call the shop</a><a href="sms:+12107733548">Text us</a></div>';
      $('res').classList.remove('hidden');
      try { history.replaceState(null, '', '?n=' + n + '&p=' + p); } catch(e) {}
    }).catch(function(){
      b.disabled = false; b.textContent = 'Check status';
      err('We couldn’t check right now. Please try again, or call (210) 773-3548.');
    });
  }
  $('f').addEventListener('submit', function(e){ e.preventDefault(); lookup(); });
  var q = new URLSearchParams(location.search);
  if (q.get('n')) $('n').value = q.get('n');
  if (q.get('p')) $('p').value = q.get('p');
  if (q.get('n') && q.get('p')) lookup();
})();
</script>
</body>
</html>
