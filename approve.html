<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Approve repair | iFixPhones</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--mist:#f5f5f7;--ink:#1d1d1f;--graphite:#6e6e73;--blue:#0071e3;--green:#1a7f37;--red:#c9302c;--line:#d2d2d7;--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);color:var(--ink);background:var(--mist);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;min-height:100vh}
a{color:#0066cc;text-decoration:none}
.nav{background:rgba(255,255,255,.86);border-bottom:1px solid rgba(0,0,0,.08)}
.nav .w{display:flex;align-items:center;justify-content:space-between;height:52px}
.brand{font-weight:600;font-size:18px;color:var(--ink)}
.w{max-width:560px;margin:0 auto;padding:0 22px}
.card{background:#fff;border-radius:22px;padding:28px 26px;margin-top:36px;box-shadow:0 2px 20px rgba(0,0,0,.04)}
h1{font-size:28px;letter-spacing:-.025em;line-height:1.15}
.sub{color:var(--graphite);margin-top:6px}
.item{display:flex;justify-content:space-between;gap:16px;align-items:baseline;border-top:1px solid #ececf0;border-bottom:1px solid #ececf0;padding:16px 0;margin-top:20px;font-size:18px}
.item b{font-size:22px}
.why{background:var(--mist);border-radius:12px;padding:12px 14px;margin-top:16px;font-size:15px;line-height:1.45}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.btn{border:0;border-radius:999px;padding:14px;font:inherit;font-size:17px;font-weight:600;cursor:pointer}
.yes{background:var(--blue);color:#fff}.no{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.6}
.small{font-size:13px;color:var(--graphite);margin-top:14px;line-height:1.45}
.done{text-align:center}
.done .ic{width:56px;height:56px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px}
.err{color:var(--red);margin-top:12px}
.foot{text-align:center;color:var(--graphite);font-size:13px;margin:30px 0}
</style>
</head>
<body>
<nav class="nav"><div class="w"><a class="brand" href="/">iFixPhones</a><a href="tel:+12107733548">Call</a></div></nav>
<main class="w">
  <div class="card" id="c" aria-live="polite"><p class="sub">Loading…</p></div>
  <p class="foot">Questions? Call <a href="tel:+12107733548">(210) 773-3548</a> or text <a href="sms:+12107242800">(210) 724-2800</a>.</p>
</main>
<script>
(function(){
  var BASE = 'https://firestore.googleapis.com/v1/projects/ifixphones-ca10e/databases/(default)/documents/approvals/';
  var KEY = 'AIzaSyADty-4Af9uDsTSY5MDUr0pfDlSF3HS9DI';
  var PO_TOKEN = 'a5kkcfdzh96mzd9vvq56cof48ncp38', PO_USER = 'uku53twtd8174esng6mszeyofke9kh';
  var k = (new URLSearchParams(location.search).get('k') || '').replace(/[^a-z0-9]/gi, '');
  var c = document.getElementById('c'), data = null;
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(x){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]; }); }
  function money(n){ n = Number(n)||0; return '$' + (Math.round(n*100) % 100 ? n.toFixed(2) : String(Math.round(n))); }
  function val(f){ if (!f) return ''; if ('stringValue' in f) return f.stringValue; if ('integerValue' in f) return Number(f.integerValue); if ('doubleValue' in f) return f.doubleValue; return ''; }
  function fail(m){ c.innerHTML = '<h1>Something’s off</h1><p class="sub">' + m + '</p>'; }
  function doneView(status){
    var ok = status === 'approved';
    c.innerHTML = '<div class="done"><div class="ic" style="background:' + (ok ? 'var(--green)' : '#86868b') + '">' + (ok ? '✓' : '–') + '</div>' +
      '<h1>' + (ok ? 'Approved. Thank you!' : 'Got it. We won’t do it.') + '</h1>' +
      '<p class="sub" style="margin-top:8px">' + (ok ? 'We’ll go ahead with ' + esc(data.item) + '. We’ll text you when your ' + esc(data.dev || 'device') + ' is ready.' : 'We’ll finish the original repair only. Questions? Give us a call.') + '</p></div>';
  }
  function show(){
    if (data.status !== 'pending') { doneView(data.status); return; }
    c.innerHTML = '<p class="sub">Ticket #' + esc(data.n) + ' · ' + esc(data.dev) + '</p>' +
      '<h1 style="margin-top:6px">' + (data.first ? 'Hi ' + esc(data.first) + ', w' : 'W') + 'e need your OK.</h1>' +
      '<p class="sub">While working on your device, we found it also needs:</p>' +
      '<div class="item"><span>' + esc(data.item) + '</span><b>' + money(data.price) + '</b></div>' +
      (data.note ? '<div class="why">' + esc(data.note) + '</div>' : '') +
      '<div class="btns"><button class="btn no" data-d="declined">No thanks</button><button class="btn yes" data-d="approved">Approve ' + money(data.price) + '</button></div>' +
      '<p class="small">This adds ' + money(data.price) + ' to your repair. Paid at pickup. Covered by our <a href="policy.html">warranty and repair policy</a>.</p><p class="err" id="e"></p>';
  }
  c.addEventListener('click', function(e){
    var b = e.target.closest('[data-d]'); if (!b) return;
    var d = b.getAttribute('data-d');
    Array.prototype.forEach.call(c.querySelectorAll('[data-d]'), function(x){ x.disabled = true; });
    var url = BASE + k + '?key=' + KEY + '&updateMask.fieldPaths=status&updateMask.fieldPaths=decidedAt&currentDocument.exists=true';
    fetch(url, {method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({fields:{status:{stringValue:d}, decidedAt:{integerValue:String(Date.now())}}})})
      .then(function(r){
        if (!r.ok) throw new Error(String(r.status));
        data.status = d; doneView(d);
        try { fetch('https://api.pushover.net/1/messages.json', {method:'POST', mode:'no-cors', body: new URLSearchParams({token:PO_TOKEN, user:PO_USER, title:(d === 'approved' ? '✅ Customer APPROVED' : '❌ Customer declined') + ' extra work', message:'#' + data.n + ' · ' + data.dev + ' · ' + data.item + ' (' + money(data.price) + ')', priority:'1', url:'https://ifixphones.net/tickets.html', url_title:'Open tickets'})}).catch(function(){}); } catch(x) {}
      })
      .catch(function(err){
        if (String(err.message) === '403') { load(); return; }
        Array.prototype.forEach.call(c.querySelectorAll('[data-d]'), function(x){ x.disabled = false; });
        var e2 = document.getElementById('e'); if (e2) e2.textContent = 'That didn’t go through. Please try again or call (210) 773-3548.';
      });
  });
  function load(){
    if (!k) { fail('This link is missing its code. Use the link from our text message, or call us.'); return; }
    fetch(BASE + k + '?key=' + KEY, {cache:'no-store'}).then(function(r){
      if (r.status === 404 || r.status === 403) return null;
      if (!r.ok) throw new Error('net');
      return r.json();
    }).then(function(j){
      if (!j) { fail('This link isn’t valid anymore. Please call us at (210) 773-3548.'); return; }
      var f = j.fields || {};
      data = {n:val(f.n), dev:val(f.dev), first:val(f.first), item:val(f.item), price:val(f.price), note:val(f.note), status:val(f.status)};
      show();
    }).catch(function(){ fail('We couldn’t load this right now. Please try again in a minute.'); });
  }
  load();
})();
</script>
</body>
</html>
