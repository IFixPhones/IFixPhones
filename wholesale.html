<style>
:root{--bg:#f5f5f7;--ink:#1d1d1f;--sub:#6e6e73;--line:#d2d2d7;--blue:#0071e3;--blue2:#0077ed;--link:#0066cc;--green:#1a7f37;--amber:#b25000;--red:#c9302c;--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;--r:18px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font);color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased;letter-spacing:-.016em;min-height:100vh}
a{color:var(--link);text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
.w{max-width:1120px;margin:0 auto;padding:0 22px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* nav */
.hdr{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.8);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(0,0,0,.08)}

.hbtn{display:inline-flex;align-items:center;gap:6px;border:0;background:none;border-radius:999px;padding:7px 11px;font-size:13.5px;color:var(--ink)}

@media (max-width:700px){.hdr .w{height:auto;flex-wrap:wrap;padding-top:9px;padding-bottom:9px;gap:8px}.hsearch{order:3;flex-basis:100%;max-width:none;margin-left:0}.hact{margin-left:auto}.hbtn .t{display:none}}

.cta{display:flex;gap:22px;justify-content:center;align-items:center;margin-top:26px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 24px;font-size:17px;font-weight:400;background:var(--blue);color:#fff}
.btn:hover{background:var(--blue2)}

.more{border:0;background:none;color:var(--link);font-size:17px}.more::after{content:" ›"}.more:hover{text-decoration:underline}
.art{display:flex;justify-content:center;align-items:flex-end;gap:clamp(14px,4vw,48px);margin:46px auto 0;padding:46px 20px 0;background:var(--bg);border-radius:28px;max-width:980px;height:clamp(220px,32vw,340px);overflow:hidden}

.page{padding:40px 0 80px}
.page h2{font-size:clamp(32px,4.4vw,44px);letter-spacing:-.035em}

.pill.new{color:var(--blue)}.pill.confirmed{color:var(--amber)}.pill.ready{color:var(--green)}.pill.done{color:var(--sub)}.pill.cancelled{color:var(--red)}
.state{max-width:560px;margin:70px auto;text-align:center;padding:0 10px}
.state .ic{font-size:40px}.state h2{font-size:clamp(30px,4vw,40px);margin-top:12px;letter-spacing:-.035em}.state p{color:var(--sub);font-size:17px;margin-top:10px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:rgba(29,29,31,.92);backdrop-filter:blur(10px);color:#fff;padding:11px 20px;border-radius:999px;font-size:14px;z-index:70;opacity:0;transition:opacity .25s;pointer-events:none}

footer{background:var(--bg);color:var(--sub);font-size:12px;border-top:1px solid #e8e8ed}

    var i = (approved() ? S.items : S.pub).filter(function(x){ return x.id === id; })[0]; if (!i) return;
    closeDetail();
    var k = kind(i), locked = !approved(), inf = info(i), av = locked ? (i.inStock ? 5 : 0) : i.avail, n = S.cart[i.id] || 0;
    var fits = SHARED[i.model + '|' + k];
    var buy = locked ? '<button class="lockp" data-a="auth" data-v="' + (S.st === 'in' ? 'none' : 'signin') + '"' + (S.st === 'in' ? ' disabled' : '') + '>' + (S.st === 'in' ? 'Price after approval' : 'Sign in for price') + '</button>'
      : '<div class="pr">' + money(i.price) + '</div><div class="stock' + (av <= 0 ? ' out' : av <= 3 ? ' low' : '') + '">' + (av <= 0 ? 'Out of stock' : av <= 3 ? 'Only ' + av + ' left' : 'In stock') + '</div><div class="buy">' +
        (n ? '<div class="qty"><button data-a="q" data-id="' + esc(i.id) + '" data-v="-1" aria-label="One less">−</button><b>' + n + '</b><button data-a="q" data-id="' + esc(i.id) + '" data-v="1" aria-label="One more"' + (n >= i.avail ? ' disabled' : '') + '>+</button></div><button class="more" data-a="cart">View bag</button>'
           : '<button class="add" data-a="q" data-id="' + esc(i.id) + '" data-v="1"' + (av <= 0 ? ' disabled' : '') + '>' + (av <= 0 ? 'Sold out' : 'Add to bag') + '</button>') + '</div>';
    var el = document.createElement('div'); el.className = 'scrim center'; detail = el; el.dataset.id = id;
    el.innerHTML = '<div class="pd" role="dialog" aria-modal="true" aria-labelledby="pd-h"><button class="x" data-close aria-label="Close">×</button><div class="pdg">' +
      '<div class="zoom" id="pd-z">' + pic(k, 0, i.model) + '<span class="zhint">' + ('ontouchstart' in window ? 'Tap to zoom' : 'Click to zoom') + '</span></div>' +
      '<div class="pdi"><div class="kind ' + k + '">' + KIND[k][0] + '</div><h2 id="pd-h">' + esc(i.model) + '</h2><div class="q">' + (k === 'batt' ? 'Replacement battery' : esc(i.label) + ' screen assembly') + '</div>' +
      (k !== 'batt' ? '<div><span class="cover">3-month warranty</span></div>' : '') + buy +
      '<p class="desc">' + esc(inf.desc) + '</p><ul class="feat">' + inf.rows.map(function(r){ return '<li><b>' + esc(r[0]) + '</b><span>' + esc(r[1]) + '</span></li>'; }).join('') + '</ul>' +
      (fits ? '<div class="fits">Fits ' + fits.map(esc).join(' and ') + '.</div>' : '') + '</div></div></div>';
    document.body.appendChild(el);
    el.addEventListener('click', function(e){ if (e.target === el || e.target.closest('[data-close]')) closeDetail(); });
    var z = $('#pd-z', el), media = z.querySelector('img,svg');
    function at(cx, cy){ var r = z.getBoundingClientRect(); media.style.transformOrigin = ((cx - r.left) / r.width * 100) + '% ' + ((cy - r.top) / r.height * 100) + '%'; }
    z.addEventListener('click', function(e){ z.classList.toggle('on'); at(e.clientX, e.clientY); var h = z.querySelector('.zhint'); if (h) h.style.display = 'none'; });
    z.addEventListener('pointermove', function(e){ if (z.classList.contains('on')) at(e.clientX, e.clientY); });
  }
  function closeDetail(){ if (detail) { detail.remove(); detail = null; } }

  /* ---------- cart drawer ---------- */
  var drawer = null;
  function closeDrawer(){ if (drawer) { drawer.remove(); drawer = null; } }
  function openCart(){
    closeDrawer();
    var lines = cartLines(), sub = cartSub(), tax = exempt() ? 0 : Math.round(sub * TAX * 100) / 100;
    var el = document.createElement('div'); drawer = el;
    el.innerHTML = '<div class="scrim" data-close></div><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="cart-h"><div class="dh"><h2 id="cart-h">Your bag</h2><button class="x" data-close aria-label="Close">×</button></div>' +
      (lines.length ? '<div class="db">' + lines.map(function(l){ var k = kind(l.item); return '<div class="line"><div class="mini">' + pic(k, 1, l.item.model) + '</div><div class="nm">' + esc(l.item.model) + '<span>' + esc(l.item.label) + ' · ' + money(l.item.price) + '</span></div><div class="qty"><button data-a="q" data-id="' + esc(l.item.id) + '" data-v="-1" aria-label="One less">−</button><b>' + l.qty + '</b><button data-a="q" data-id="' + esc(l.item.id) + '" data-v="1" aria-label="One more"' + (l.qty >= l.item.avail ? ' disabled' : '') + '>+</button></div><div class="lt">' + money(l.qty * l.item.price) + '</div></div>'; }).join('') +
        '<div class="opts" role="radiogroup" aria-label="Pickup or delivery"><label><input type="radio" name="mt" value="pickup" checked> Pickup</label><label><input type="radio" name="mt" value="delivery"> Local delivery</label></div>' +
        '<div class="field"><label for="rv-note">Note (optional)</label><textarea id="rv-note" maxlength="400"></textarea></div>' +
        '<p class="hint">This sends an order request. We’ll confirm stock and text you when it’s ready. Pay at pickup: cash, Zelle, or card (+3%). Screens carry a 3-month warranty for dead-on-arrival and defects (<a href="policy.html#s20">details</a>).</p></div>' +
        '<div class="df"><div class="tot"><div><span>Subtotal</span><span>' + money(sub) + '</span></div><div><span>' + (exempt() ? 'Sales tax (resale certificate on file)' : 'Sales tax 8.25%') + '</span><span>' + money(tax) + '</span></div><div class="big"><span>Estimated total</span><span>' + money(sub + tax) + '</span></div></div><button class="btn full" id="rv-send" style="margin-top:12px">Send order · ' + money(sub + tax) + '</button><div class="err" id="rv-err" role="alert"></div></div>'
      : '<div class="db"><div class="empty"><h3>Your bag is empty</h3><p>Add screens or batteries to get started.</p></div></div>') + '</aside>';
    document.body.appendChild(el);
    el.addEventListener('click', function(e){ if (e.target.closest('[data-close]')) closeDrawer(); });
    var s = $('#rv-send', el); if (s) s.addEventListener('click', function(){ sendOrder(el); });
  }
  function sendOrder(el){
    var btn = $('#rv-send', el), err = $('#rv-err', el), lines = cartLines(); if (!lines.length) return;
    btn.disabled = true; btn.textContent = 'Sending…'; err.textContent = '';
    var me = S.me || {}, now = Date.now(), sub = Math.round(cartSub() * 100) / 100, code = 'W' + now.toString(36).slice(-5).toUpperCase();
    var o = {uid:S.user.uid, shop:me.shop || '', name:me.name || '', phone:me.phone || '', email:S.user.email || '',
      items:lines.map(function(l){ return {id:l.item.id, brand:l.item.brand, model:l.item.model, label:l.item.label, cat:l.item.cat, price:l.item.price, qty:l.qty}; }),
      subtotal:sub, method:(el.querySelector('input[name=mt]:checked')||{}).value || 'pickup', note:$('#rv-note', el).value.trim().slice(0, 400), status:'new', createdAt:now, code:code};
    firebase.firestore().collection('wsorders').add(o).then(function(){
      push('New WHOLESALE order ' + code, (me.shop || '') + ' · ' + lines.reduce(function(a, l){ return a + l.qty; }, 0) + ' items · ' + money(sub) + '\n' + lines.map(function(l){ return l.qty + '× ' + l.item.model + ' ' + l.item.label; }).join('\n'));
      S.cart = {}; saveCart(); closeDrawer(); S.view = 'orders'; render(); window.scrollTo(0, 0); toast('Order sent! We’ll text you when it’s ready.');
    }).catch(function(e){ btn.disabled = false; btn.textContent = 'Send order'; err.textContent = /permission/.test(e && e.code) ? 'Your account can’t order right now. Call ' + SHOP_PHONE + '.' : 'Couldn’t send. Check your connection and try again.'; });
  }
  function bump(id, d){
    var i = itemById(id); if (!i) return;
    var n = Math.max(0, Math.min((S.cart[id] || 0) + d, Math.max(0, i.avail)));
    if (n) S.cart[id] = n; else delete S.cart[id];
    saveCart(); render();
    if (detail) openDetail(detail.dataset.id);
    if (drawer) openCart(); else if (d > 0 && n === 1) toast('Added to bag');
  }

  /* ---------- sign in / apply ---------- */
  var dlg = null;
  function closeDlg(){ if (dlg) { dlg.remove(); dlg = null; } }
  function authBox(mode){
    closeDlg(); S.mode = mode;
    var el = document.createElement('div'); dlg = el; el.className = 'scrim center';
    var body;
    if (mode === 'reset') body = '<h2>Reset your password</h2><p class="hint">We’ll email you a link.</p><div class="field"><label for="em">Email</label><input id="em" type="email" autocomplete="email" value="' + esc(S.em||'') + '"></div><button class="btn full" style="margin-top:14px" data-a="reset">Send reset link</button><div class="err" id="err" role="alert"></div><p style="text-align:center"><button class="link" data-a="auth" data-v="signin">Back to sign in</button></p>';
    else body = '<h2>' + (mode === 'apply' ? 'Apply for wholesale' : 'Sign in') + '</h2><div class="tabs2" role="group"><button data-a="auth" data-v="signin" aria-pressed="' + (mode === 'signin') + '">Sign in</button><button data-a="auth" data-v="apply" aria-pressed="' + (mode === 'apply') + '">Apply</button></div>' +
      (mode === 'signin' ? '<div class="field"><label for="em">Email</label><input id="em" type="email" autocomplete="email" value="' + esc(S.em||'') + '"></div><div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"></div><button class="btn full" style="margin-top:14px" data-a="signin">Sign in</button><div class="err" id="err" role="alert"></div><p style="text-align:center"><button class="link" data-a="auth" data-v="reset">Forgot password?</button></p>' : applyFields(false));
    el.innerHTML = '<div class="dlg" role="dialog" aria-modal="true"><div style="display:flex;justify-content:flex-end;margin:-8px -6px 0 0"><button class="x" data-close aria-label="Close">×</button></div>' + body + '</div>';
    document.body.appendChild(el);
    el.addEventListener('click', function(e){ if (e.target === el || e.target.closest('[data-close]')) closeDlg(); });
    var f = el.querySelector('input'); if (f) setTimeout(function(){ f.focus(); }, 30);
  }
  function applyFields(existing){
    return '<div class="field"><label for="ap-shop">Shop / business name</label><input id="ap-shop" maxlength="80" autocomplete="organization"></div>' +
      '<div class="g2"><div class="field"><label for="ap-name">Your name</label><input id="ap-name" maxlength="60" autocomplete="name"></div><div class="field"><label for="ap-phone">Cell phone</label><input id="ap-phone" type="tel" maxlength="20" autocomplete="tel"></div></div>' +
      '<div class="g2"><div class="field"><label for="ap-city">City</label><input id="ap-city" maxlength="60" value="San Antonio"></div><div class="field"><label for="ap-tax">TX tax permit # (optional)</label><input id="ap-tax" maxlength="30" inputmode="numeric"></div></div>' +
      (existing ? '' : '<div class="field"><label for="em">Email</label><input id="em" type="email" autocomplete="email"></div><div class="field"><label for="pw">Create a password (8+ characters)</label><input id="pw" type="password" autocomplete="new-password"></div>') +
      '<p class="hint"><b>Buying tax-free:</b> add your 11-digit Texas sales tax permit number, then bring a signed Texas Resale Certificate (Form 01-339) to your first pickup. Until we have it, 8.25% sales tax is added.</p>' +
      '<button class="btn full" style="margin-top:12px" data-a="' + (existing ? 'finish' : 'apply') + '">Apply for wholesale</button><div class="err" id="err" role="alert"></div>';
  }
  function val(id){ var e = document.getElementById(id); return e ? e.value.trim() : ''; }
  function appData(){
    var o = {shop:val('ap-shop'), name:val('ap-name'), phone:val('ap-phone'), city:val('ap-city'), taxId:val('ap-tax')};
    if (o.shop.length < 2) return 'Enter your shop or business name.';
    if (o.name.length < 2) return 'Enter your name.';
    if (digits(o.phone).length < 10) return 'Enter a 10-digit phone number.';
    if (o.taxId && digits(o.taxId).length !== 11) return 'A Texas sales tax permit number is 11 digits. Check it, or leave it blank.';
    return o;
  }
  function writeApp(u, o){
    var doc = {shop:o.shop.slice(0,80), name:o.name.slice(0,60), phone:fmtPhone(o.phone).slice(0,20), city:o.city.slice(0,60), taxId:o.taxId.slice(0,30), email:String(u.email||'').slice(0,100), status:'pending', createdAt:Date.now()};
    return firebase.firestore().doc('wholesalers/' + u.uid).set(doc).then(function(){
      push('New wholesale application', doc.shop + ' · ' + doc.name + ' · ' + doc.phone + (doc.taxId ? ' · tax permit ' + doc.taxId : ' · no tax permit') + '\nApprove it in Tickets → Wholesale');
    });
  }
  document.addEventListener('click', function(e){
    var b = e.target.closest('[data-a]'); if (!b) return;
    var a = b.getAttribute('data-a'), v = b.getAttribute('data-v'), err = $('#err');
    function fail(m){ if (err) { err.className = 'err'; err.textContent = m; } b.disabled = false; }
    if (a === 'auth') { if (v === 'none') return; S.em = val('em') || S.em; closeDetail(); authBox(v); }
    else if (a === 'signin') {
      var em = val('em'), pw = (document.getElementById('pw')||{}).value || '';
      if (!em || !pw) return fail('Enter your email and password.');
      b.disabled = true; S.em = em;
      firebase.auth().signInWithEmailAndPassword(em, pw).then(function(){ closeDlg(); }).catch(function(x){ fail(authMsg(x)); });
    }
    else if (a === 'reset') {
      var em2 = val('em'); if (!em2) return fail('Enter your email.');
      b.disabled = true;
      firebase.auth().sendPasswordResetEmail(em2).then(function(){ err.className = 'err ok'; err.textContent = 'If that email has an account, a reset link is on its way. Check spam too.'; }).catch(function(x){ fail(authMsg(x)); });
    }
    else if (a === 'apply') {
      var o = appData(); if (typeof o === 'string') return fail(o);
      var em3 = val('em'), pw3 = (document.getElementById('pw')||{}).value || '';
      if (!/^\S+@\S+\.\S+$/.test(em3)) return fail('Enter a valid email.');
      if (pw3.length < 8) return fail('Use a password with at least 8 characters.');
      if (em3.toLowerCase() === SHOP_EMAIL) return fail('Use your own shop’s email.');
      b.disabled = true; b.textContent = 'Sending…'; S.applying = o;
      firebase.auth().createUserWithEmailAndPassword(em3, pw3).then(function(){ closeDlg(); window.scrollTo(0, 0); }).catch(function(x){ S.applying = null; b.textContent = 'Apply for wholesale'; fail(authMsg(x)); });
    }
    else if (a === 'finish') { var o2 = appData(); if (typeof o2 === 'string') return fail(o2); b.disabled = true; writeApp(S.user, o2).catch(function(){ fail('Couldn’t send. Try again.'); }); }
    else if (a === 'signout') { if (!confirm('Sign out?')) return; stop(); stopShop(); firebase.auth().signOut(); }
    else if (a === 'cat') { S.cat = v; render(); }
    else if (a === 'series') { S.series = v; render(); }
    else if (a === 'view') { S.view = v; closeDrawer(); render(); window.scrollTo(0, 0); }
    else if (a === 'cart') { closeDetail(); openCart(); }
    else if (a === 'q') bump(b.getAttribute('data-id'), Number(v));
    else if (a === 'detail') openDetail(b.getAttribute('data-id'));
    else if (a === 'reorder') {
      var ro = S.orders.filter(function(x){ return x.id === b.getAttribute('data-id'); })[0]; if (!ro) return;
      var added = 0; (ro.items||[]).forEach(function(l){ var it = itemById(l.id); if (it && it.avail > 0) { S.cart[l.id] = Math.min(it.avail, (S.cart[l.id] || 0) + l.qty); added++; } });
      saveCart(); S.view = 'shop'; render(); if (added) openCart(); else toast('Those parts are out of stock right now');
    }
    else if (a === 'cancel') {
      if (!confirm('Cancel this order?')) return;
      var o3 = S.orders.filter(function(x){ return x.id === b.getAttribute('data-id'); })[0];
      firebase.firestore().doc('wsorders/' + b.getAttribute('data-id')).update({status:'cancelled', cancelledAt:Date.now()}).then(function(){ toast('Order cancelled'); push('Wholesale order cancelled', (o3 && o3.code || '') + ' · ' + ((S.me||{}).shop || '')); }).catch(function(){ toast('Couldn’t cancel. Call ' + SHOP_PHONE + '.'); });
    }
  });
  var qT; $('#q').addEventListener('input', function(e){ S.q = e.target.value; clearTimeout(qT); qT = setTimeout(function(){ if (S.view !== 'shop') S.view = 'shop'; render(); }, 120); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && dlg && e.target.matches && e.target.matches('.dlg input')) { var bt = dlg.querySelector('.btn.full'); if (bt) bt.click(); }
    if (e.key === 'Escape') { closeDlg(); closeDrawer(); closeDetail(); }
  });

  /* ---------- data ---------- */
  function listenPublic(){
    unsubs.push(firebase.firestore().doc('public/wscatalog').onSnapshot(function(snap){ S.pub = (snap.exists && (snap.data() || {}).items) || []; render(); }, function(){}));
  }
  function listen(u){
    var db = firebase.firestore();
    unsubs.push(db.doc('wholesalers/' + u.uid).onSnapshot(function(snap){
      if (!snap.exists) {
        if (S.applying) { var o = S.applying; S.applying = null; writeApp(u, o).catch(function(){}); return; }
        S.me = null; S.st = 'nodoc'; render(); return;
      }
      var was = S.me && S.me.status;
      S.me = snap.data(); S.st = 'in';
      if (S.me.status === 'approved' && was !== 'approved') startShop(u);
      if (S.me.status !== 'approved') stopShop();
      render();
    }, function(){ S.st = 'nodb'; render(); }));
  }
  function startShop(u){
    stopShop(); loadCart();
    var db = firebase.firestore();
    shopUnsubs.push(db.doc('wholesale/catalog').onSnapshot(function(snap){ S.items = (snap.exists && (snap.data() || {}).items) || []; render(); }, function(){ S.items = []; render(); }));
    shopUnsubs.push(db.collection('wsorders').where('uid', '==', u.uid).onSnapshot(function(snap){
      S.orders = snap.docs.map(function(d){ var o = d.data(); o.id = d.id; return o; }).sort(function(a, b){ return b.createdAt - a.createdAt; }); render();
    }, function(){}));
  }

  if (!window.firebase) { S.st = 'nodb'; render(); return; }
  firebase.initializeApp(FB_CONFIG);
  firebase.auth().onAuthStateChanged(function(u){
    stop(); stopShop(); S.user = u; S.me = null; S.items = []; S.orders = []; S.view = 'shop';
    listenPublic();
    if (!u) { S.st = 'out'; render(); return; }
    if (String(u.email||'').toLowerCase() === SHOP_EMAIL) { S.st = 'shop'; render(); return; }
    S.st = 'loading'; render(); listen(u);
  });
})();
</script>
</body>
</html>
