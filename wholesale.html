      '<rect x="100" y="56" width="18" height="34" rx="3" fill="#c46a1f"/><rect x="106" y="60" width="10" height="12" rx="2" fill="#d9a35a"/>' +
      '<rect x="8" y="4" width="98" height="192" rx="18" fill="#0a0b0e"/><rect x="12" y="8" width="90" height="184" rx="15" fill="url(#g' + k + ')"/><circle cx="57" cy="20" r="3.4" fill="#000" stroke="#2b3040"/>' +
      '<path d="M12 8h50L22 192h-10z" fill="url(#s' + k + ')" opacity=".9"/>' + (oled ? '<rect x="12" y="8" width="90" height="184" rx="15" fill="none" stroke="rgba(120,150,255,.25)"/>' : '') + '</svg>';

  /* ---------- render ---------- */
  function header(){
    var h = $('#hact'), n = cartCount();
    if (S.st === 'out' || S.st === 'loading') h.innerHTML = '<button class="hbtn" data-a="auth" data-v="signin">Sign in</button><button class="hbtn solid" data-a="auth" data-v="apply">Apply</button>';

  function render(){
    header();
    var app = $('#app');
    if (S.st === 'loading') { app.innerHTML = '<div class="w"><div class="grid">' + '<div class="skel"></div>'.repeat(4) + '</div></div>'; return; }
    if (S.st === 'nodb') { app.innerHTML = '<div class="w">' + state('⚠️', 'Couldn’t load', 'Check your internet connection and reload the page.') + '</div>'; return; }
    if (S.st === 'shop') { app.innerHTML = '<div class="w">' + state('🛠️', 'You’re signed in as the shop', 'Manage wholesale shops, prices and orders in the Tickets app → Wholesale tab.', '<a class="btn" style="margin-top:16px" href="/tickets.html">Open Tickets</a>') + '</div>'; return; }
    if (S.st === 'nodoc') { app.innerHTML = '<div class="w"><div class="state" style="text-align:left"><h2>Finish your application</h2><p>We need a few details about your shop.</p>' + applyFields(true) + '</div></div>'; return; }
    var me = S.me || {};
    if (S.st === 'in' && me.status === 'pending') { app.innerHTML = '<div class="w">' + state('⏳', 'Thanks, ' + esc((me.name||'').split(' ')[0] || 'there') + '!', '<b>' + esc(me.shop) + '</b> is waiting for approval. We usually review new shops within one business day and will text you at ' + esc(fmtPhone(me.phone)) + '.', '<p class="hint">To buy tax-free, bring a signed Texas Resale Certificate (Form 01-339) to your first pickup. Questions? Call or text ' + SHOP_PHONE + '.</p>') + '</div>' + catalogSection(true); return; }
    if (S.st === 'in' && (me.status === 'declined' || me.status === 'off')) { app.innerHTML = '<div class="w">' + state('🔒', 'Wholesale access is off', 'This account can’t see wholesale prices right now. Call or text ' + SHOP_PHONE + ' if you think this is a mistake.') + '</div>'; return; }
    if (approved() && S.view === 'orders') { app.innerHTML = ordersView(); return; }
    app.innerHTML = hero() + (approved() ? '' : trust()) + catalogSection(false) + (approved() ? '' : band());
    reveal();
  }
  var seen = {};
  function reveal(){
    var els = Array.prototype.slice.call(document.querySelectorAll('.reveal'));
    if (!('IntersectionObserver' in window)) { els.forEach(function(e){ e.classList.add('on'); }); return; }
    var io = new IntersectionObserver(function(es){ es.forEach(function(x){ if (x.isIntersecting) { x.target.classList.add('on'); seen[x.target.className + x.target.textContent.length] = 1; io.unobserve(x.target); } }); }, {threshold:.12});
    els.forEach(function(e){ if (seen[e.className + e.textContent.length]) e.classList.add('on'); else io.observe(e); });
  }
  function state(ic, h, p, extra){ return '<div class="state"><div class="ic" aria-hidden="true">' + ic + '</div><h2>' + h + '</h2><p>' + p + '</p>' + (extra||'') + '</div>'; }
  function hero(){
    if (approved()) return '<section class="hero slim"><div class="w"><div class="eyebrow">Welcome back, ' + esc((S.me.name||'').split(' ')[0] || 'partner') + '.</div><h1>' + esc(S.me.shop || 'Your shop') + '</h1></div></section>';
    return '<section class="hero"><div class="w reveal"><div class="eyebrow">iFixPhones Wholesale</div><h1>Screens and batteries.<br><em>Best price.</em></h1><p>JK Soft OLED and JK Incell screens, plus batteries, for every iPhone. Tested, in stock, ready for pickup today.</p><div class="cta"><button class="btn" data-a="auth" data-v="apply">Apply for an account</button><button class="more" data-a="auth" data-v="signin">Sign in</button></div></div>' +
      '<div class="w"><div class="art reveal" aria-hidden="true"><div class="s">' + art('incell') + '</div><div>' + art('oled') + '</div><div class="s">' + art('batt') + '</div></div></div></section>';
  }

  function trust(){
    return '<div class="w"><div class="facts reveal"><div><b>JK only</b><span>Soft OLED and Incell</span></div><div><b>Tested</b><span>Every part, before pickup</span></div><div><b>Same day</b><span>Pickup or local delivery</span></div><div><b>Tax-free</b><span>With a Texas resale certificate</span></div></div></div>';
  }

  function band(){
    return '<section class="steps reveal"><div><div class="n">Step 1</div><h3>Apply.</h3><p>Open a free account for your shop. It takes about a minute.</p></div><div><div class="n">Step 2</div><h3>Get approved.</h3><p>We review shops within one business day and text you when you’re in.</p></div><div><div class="n">Step 3</div><h3>Pick up today.</h3><p>Order online and we’ll text you when it’s packed. Pay with cash, Zelle or card.</p></div></section>';
  }

  function filtered(){
    var q = S.q.toLowerCase().trim(), L = list();
    return L.filter(function(i){
      var k = kind(i);
      if (S.cat === 'screens' && k === 'batt') return false;
      if (S.cat === 'oled' && k !== 'oled') return false;
      if (S.cat === 'incell' && k !== 'incell') return false;
      if (S.cat === 'batt' && k !== 'batt') return false;
      if (S.series !== 'all' && seriesOf(i.model) !== S.series) return false;
      if (q) { var hay = (i.model + ' ' + i.label + ' ' + KIND[k][0] + ' ' + (k === 'batt' ? 'battery' : 'screen lcd display')).toLowerCase(); if (!q.split(/\s+/).every(function(w){ return hay.indexOf(w) > -1; })) return false; }
      return true;
    });
  }
  function catalogSection(locked){
    var L = list();
    var cats = [['all','All'],['oled','Soft OLED'],['incell','Incell'],['batt','Batteries']];
    var ser = []; L.forEach(function(i){ var s = seriesOf(i.model); if (ser.indexOf(s) < 0) ser.push(s); });
    ser.sort(function(a, b){ var x = parseInt(a, 10), y = parseInt(b, 10); return (isNaN(y) ? -1 : y) - (isNaN(x) ? -1 : x); });
    var items = filtered();
    var h = '<section class="shop' + (approved() ? ' tight' : '') + '" id="parts"><div class="w">' + (approved() ? '' : '<h2>Shop parts.</h2><p class="lead">Everything we stock, in one place.</p>') +
      '<div class="segwrap"><div class="seg" role="group" aria-label="Category">' + cats.map(function(c){ return '<button data-a="cat" data-v="' + c[0] + '" aria-pressed="' + (S.cat === c[0]) + '">' + c[1] + '</button>'; }).join('') + '</div></div>';
    if (ser.length > 1) h += '<div class="series" role="group" aria-label="Model">' + [['all','All models']].concat(ser.map(function(s){ return [s, /^\d+$/.test(s) ? 'iPhone ' + s : s === 'Air' ? 'iPhone Air' : s]; })).map(function(s){ return '<button data-a="series" data-v="' + esc(s[0]) + '" aria-pressed="' + (S.series === s[0]) + '">' + esc(s[1]) + '</button>'; }).join('') + '</div>';
    if (!L.length) h += '<div class="empty"><h3>New stock is on the way.</h3><p>Our next JK shipment lands soon. ' + (approved() ? 'Check back shortly.' : 'Apply now so you’re ready when it arrives.') + '</p></div>';
    else if (!items.length) h += '<div class="empty"><h3>No matches.</h3><p>Try a shorter search, like “14 Pro”.</p></div>';
    else h += '<div class="count">' + items.length + ' part' + (items.length === 1 ? '' : 's') + '</div><div class="grid">' + items.map(function(i){ return card(i, locked || !approved()); }).join('') + '</div>';
    return h + '</div></section>';
  }

  function card(i, locked){
    var k = kind(i), av = locked ? (i.inStock ? 5 : 0) : i.avail;
    var st = av <= 0 ? '<div class="stock out">Out of stock</div>' : (!locked && av <= 3) ? '<div class="stock low">Only ' + av + ' left</div>' : '<div class="stock">In stock</div>';
    var sub = k === 'batt' ? (/battery/i.test(i.label) ? 'Replacement battery' : esc(i.label)) : esc(i.label);
    var body = '<div class="cbody"><div class="kind ' + k + '">' + KIND[k][0] + '</div><h3>' + esc(i.model) + '</h3><div class="q">' + sub + '</div>';
    if (locked) body += st + '<button class="lockp" data-a="auth" data-v="' + (S.st === 'in' ? 'none' : 'signin') + '"' + (S.st === 'in' ? ' disabled' : '') + '>' + (S.st === 'in' ? 'Price after approval' : 'Sign in for price') + '</button>';
    else {
      var n = S.cart[i.id] || 0;
      body += '<div class="pr">' + money(i.price) + '</div>' + st + '<div class="buy">' +
        (n ? '<div class="qty"><button data-a="q" data-id="' + esc(i.id) + '" data-v="-1" aria-label="One less">−</button><b>' + n + '</b><button data-a="q" data-id="' + esc(i.id) + '" data-v="1" aria-label="One more"' + (n >= i.avail ? ' disabled' : '') + '>+</button></div><button class="add in" data-a="cart">Bag ›</button>'
           : '<button class="add" data-a="q" data-id="' + esc(i.id) + '" data-v="1"' + (av <= 0 ? ' disabled' : '') + '>' + (av <= 0 ? 'Sold out' : 'Add') + '</button>') + '</div>';
    }
    return '<article class="card"><div class="thumb">' + art(k) + '</div>' + body + '</div></article>';
  }

  var ST = {new:'Sent', confirmed:'Confirmed', ready:'Ready for pickup', done:'Completed', cancelled:'Cancelled'};
  function ordersView(){
    var h = '<div class="w page"><button class="link" data-a="view" data-v="shop">‹ Back to parts</button><h2 style="margin-top:6px">My orders</h2>';
    if (!S.orders.length) return h + '<div class="empty"><h3>No orders yet</h3><p>Add screens or batteries to your cart and send your first order.</p><button class="btn" style="margin-top:14px" data-a="view" data-v="shop">Shop parts</button></div></div>';
    return h + '<div class="orders">' + S.orders.map(function(o){
      var d = new Date(o.createdAt);
      return '<article class="ord"><div class="hd"><div><b style="font-size:16px">Order ' + esc(o.code) + '</b><div class="hint" style="margin-top:2px">' + d.toLocaleDateString('en-US', {month:'short', day:'numeric'}) + ' · ' + d.toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'}) + ' · ' + (o.method === 'delivery' ? 'Delivery' : 'Pickup') + '</div></div><span class="pill ' + esc(o.status) + '">' + esc(ST[o.status] || o.status) + '</span></div>' +
        '<ul>' + (o.items||[]).map(function(l){ return '<li><span>' + l.qty + ' × ' + esc(l.model) + ' · ' + esc(l.label) + '</span><span>' + money(l.qty * l.price) + '</span></li>'; }).join('') + '</ul>' +
        '<div class="t"><span>' + (o.total ? 'Total' : 'Subtotal') + '</span><span>' + money(o.total || o.subtotal) + '</span></div>' +
        (o.shopNote ? '<p class="hint">Note from iFixPhones: ' + esc(o.shopNote) + '</p>' : '') +
        '<div style="display:flex;gap:14px;margin-top:8px">' + (o.status === 'new' ? '<button class="link" style="color:var(--red)" data-a="cancel" data-id="' + esc(o.id) + '">Cancel order</button>' : '') + '<button class="link" data-a="reorder" data-id="' + esc(o.id) + '">Order again</button></div></article>';
    }).join('') + '</div></div>';
  }

  /* ---------- cart drawer ---------- */
  var drawer = null;
  function closeDrawer(){ if (drawer) { drawer.remove(); drawer = null; } }
  function openCart(){
    closeDrawer();
    var lines = cartLines(), sub = cartSub(), tax = exempt() ? 0 : Math.round(sub * TAX * 100) / 100;
    var el = document.createElement('div'); drawer = el;
    el.innerHTML = '<div class="scrim" data-close></div><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="cart-h"><div class="dh"><h2 id="cart-h">Your bag</h2><button class="x" data-close aria-label="Close">×</button></div>' +
      (lines.length ? '<div class="db">' + lines.map(function(l){ var k = kind(l.item); return '<div class="line"><div class="mini">' + art(k, 1) + '</div><div class="nm">' + esc(l.item.model) + '<span>' + esc(l.item.label) + ' · ' + money(l.item.price) + '</span></div><div class="qty"><button data-a="q" data-id="' + esc(l.item.id) + '" data-v="-1" aria-label="One less">−</button><b>' + l.qty + '</b><button data-a="q" data-id="' + esc(l.item.id) + '" data-v="1" aria-label="One more"' + (l.qty >= l.item.avail ? ' disabled' : '') + '>+</button></div><div class="lt">' + money(l.qty * l.item.price) + '</div></div>'; }).join('') +
        '<div class="opts" role="radiogroup" aria-label="Pickup or delivery"><label><input type="radio" name="mt" value="pickup" checked> Pickup</label><label><input type="radio" name="mt" value="delivery"> Local delivery</label></div>' +
        '<div class="field"><label for="rv-note">Note (optional)</label><textarea id="rv-note" maxlength="400"></textarea></div>' +
        '<p class="hint">This sends an order request. We’ll confirm stock and text you when it’s ready. Pay at pickup: cash, Zelle, or card (+3%).</p></div>' +
        '<div class="df"><div class="tot"><div><span>Subtotal</span><span>' + money(sub) + '</span></div><div><span>' + (exempt() ? 'Sales tax (resale certificate on file)' : 'Sales tax 8.25%') + '</span><span>' + money(tax) + '</span></div><div class="big"><span>Estimated total</span><span>' + money(sub + tax) + '</span></div></div><button class="btn full" id="rv-send" style="margin-top:12px">Send order · ' + money(sub + tax) + '</button><div class="err" id="rv-err" role="alert"></div></div>'
      : '<div class="db"><div class="empty"><h3>Your bag is empty</h3><p>Add screens or batteries to get started.</p></div></div>') + '</aside>';
    document.body.appendChild(el);
    el.addEventListener('click', function(e){ if (e.target.closest('[data-close]')) closeDrawer(); });
    var s = $('#rv-send', el); if (s) s.addEventListener('click', function(){ sendOrder(el); });
  }
  function sendOrder(el){
    var btn = $('#rv-send', el), err = $('#rv-err', el), lines = cartLines(); if (!lines.length) return;
    btn.disabled = true; btn.textContent = 'Sending…'; err.textContent = '';
    var me = S.me || {}, now = Date.now(), sub = Math.round(cartSub() * 100) / 100, code = 'W' + now.toString(36).slice(-5).toUpperCase();
    var o = {uid:S.user.uid, shop:me.shop || '', name:me.name || '', phone:me.phone || '', email:S.user.email || '',
      items:lines.map(function(l){ return {id:l.item.id, brand:l.item.brand, model:l.item.model, label:l.item.label, cat:l.item.cat, price:l.item.price, qty:l.qty}; }),
      subtotal:sub, method:(el.querySelector('input[name=mt]:checked')||{}).value || 'pickup', note:$('#rv-note', el).value.trim().slice(0, 400), status:'new', createdAt:now, code:code};
    firebase.firestore().collection('wsorders').add(o).then(function(){
      push('New WHOLESALE order ' + code, (me.shop || '') + ' · ' + lines.reduce(function(a, l){ return a + l.qty; }, 0) + ' items · ' + money(sub) + '\n' + lines.map(function(l){ return l.qty + '× ' + l.item.model + ' ' + l.item.label; }).join('\n'));
      S.cart = {}; saveCart(); closeDrawer(); S.view = 'orders'; render(); window.scrollTo(0, 0); toast('Order sent! We’ll text you when it’s ready.');
    }).catch(function(e){ btn.disabled = false; btn.textContent = 'Send order'; err.textContent = /permission/.test(e && e.code) ? 'Your account can’t order right now. Call ' + SHOP_PHONE + '.' : 'Couldn’t send. Check your connection and try again.'; });
  }
  function bump(id, d){

    if (drawer) openCart(); else if (d > 0 && n === 1) toast('Added to bag');
  }

  function val(id){ var e = document.getElementById(id); return e ? e.value.trim() : ''; }
  function appData(){

    });
  }
  document.addEventListener('click', function(e){
    var b = e.target.closest('[data-a]'); if (!b) return;
    var a = b.getAttribute('data-a'), v = b.getAttribute('data-v'), err = $('#err');
    function fail(m){ if (err) { err.className = 'err'; err.textContent = m; } b.disabled = false; }
    if (a === 'auth') { if (v === 'none') return; S.em = val('em') || S.em; authBox(v); }
    else if (a === 'signin') {
      var em = val('em'), pw = (document.getElementById('pw')||{}).value || '';
      if (!em || !pw) return fail('Enter your email and password.');
      b.disabled = true; S.em = em;
      firebase.auth().signInWithEmailAndPassword(em, pw).then(function(){ closeDlg(); }).catch(function(x){ fail(authMsg(x)); });
    }
    else if (a === 'reset') {
      var em2 = val('em'); if (!em2) return fail('Enter your email.');
      b.disabled = true;
      firebase.auth().sendPasswordResetEmail(em2).then(function(){ err.className = 'err ok'; err.textContent = 'If that email has an account, a reset link is on its way. Check spam too.'; }).catch(function(x){ fail(authMsg(x)); });
    }
    else if (a === 'apply') {
      var o = appData(); if (typeof o === 'string') return fail(o);
      var em3 = val('em'), pw3 = (document.getElementById('pw')||{}).value || '';
      if (!/^\S+@\S+\.\S+$/.test(em3)) return fail('Enter a valid email.');
      if (pw3.length < 8) return fail('Use a password with at least 8 characters.');
      if (em3.toLowerCase() === SHOP_EMAIL) return fail('Use your own shop’s email.');
      b.disabled = true; b.textContent = 'Sending…'; S.applying = o;
      firebase.auth().createUserWithEmailAndPassword(em3, pw3).then(function(){ closeDlg(); window.scrollTo(0, 0); }).catch(function(x){ S.applying = null; b.textContent = 'Apply for wholesale'; fail(authMsg(x)); });
    }
    else if (a === 'finish') { var o2 = appData(); if (typeof o2 === 'string') return fail(o2); b.disabled = true; writeApp(S.user, o2).catch(function(){ fail('Couldn’t send. Try again.'); }); }
    else if (a === 'signout') { if (!confirm('Sign out?')) return; stop(); stopShop(); firebase.auth().signOut(); }
    else if (a === 'cat') { S.cat = v; render(); }
    else if (a === 'series') { S.series = v; render(); }
    else if (a === 'view') { S.view = v; closeDrawer(); render(); window.scrollTo(0, 0); }
    else if (a === 'cart') openCart();
    else if (a === 'q') bump(b.getAttribute('data-id'), Number(v));
    else if (a === 'reorder') {
      var ro = S.orders.filter(function(x){ return x.id === b.getAttribute('data-id'); })[0]; if (!ro) return;
      var added = 0; (ro.items||[]).forEach(function(l){ var it = itemById(l.id); if (it && it.avail > 0) { S.cart[l.id] = Math.min(it.avail, (S.cart[l.id] || 0) + l.qty); added++; } });
      saveCart(); S.view = 'shop'; render(); if (added) openCart(); else toast('Those parts are out of stock right now');
    }
    else if (a === 'cancel') {
      if (!confirm('Cancel this order?')) return;
      var o3 = S.orders.filter(function(x){ return x.id === b.getAttribute('data-id'); })[0];
      firebase.firestore().doc('wsorders/' + b.getAttribute('data-id')).update({status:'cancelled', cancelledAt:Date.now()}).then(function(){ toast('Order cancelled'); push('Wholesale order cancelled', (o3 && o3.code || '') + ' · ' + ((S.me||{}).shop || '')); }).catch(function(){ toast('Couldn’t cancel. Call ' + SHOP_PHONE + '.'); });
    }
  });
  var qT; $('#q').addEventListener('input', function(e){ S.q = e.target.value; clearTimeout(qT); qT = setTimeout(function(){ if (S.view !== 'shop') S.view = 'shop'; render(); }, 120); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && dlg && e.target.matches && e.target.matches('.dlg input')) { var bt = dlg.querySelector('.btn.full'); if (bt) bt.click(); }
    if (e.key === 'Escape') { closeDlg(); closeDrawer(); }
  });

  /* ---------- data ---------- */
  function listenPublic(){
    unsubs.push(firebase.firestore().doc('public/wscatalog').onSnapshot(function(snap){ S.pub = (snap.exists && (snap.data() || {}).items) || []; render(); }, function(){}));
  }
  function listen(u){
    var db = firebase.firestore();
    unsubs.push(db.doc('wholesalers/' + u.uid).onSnapshot(function(snap){
      if (!snap.exists) {
        if (S.applying) { var o = S.applying; S.applying = null; writeApp(u, o).catch(function(){}); return; }
        S.me = null; S.st = 'nodoc'; render(); return;
      }
      var was = S.me && S.me.status;
      S.me = snap.data(); S.st = 'in';
      if (S.me.status === 'approved' && was !== 'approved') startShop(u);
      if (S.me.status !== 'approved') stopShop();
      render();
    }, function(){ S.st = 'nodb'; render(); }));
  }
  function startShop(u){
    stopShop(); loadCart();
    var db = firebase.firestore();
    shopUnsubs.push(db.doc('wholesale/catalog').onSnapshot(function(snap){ S.items = (snap.exists && (snap.data() || {}).items) || []; render(); }, function(){ S.items = []; render(); }));
    shopUnsubs.push(db.collection('wsorders').where('uid', '==', u.uid).onSnapshot(function(snap){
      S.orders = snap.docs.map(function(d){ var o = d.data(); o.id = d.id; return o; }).sort(function(a, b){ return b.createdAt - a.createdAt; }); render();
    }, function(){}));
  }

  if (!window.firebase) { S.st = 'nodb'; render(); return; }
  firebase.initializeApp(FB_CONFIG);
  firebase.auth().onAuthStateChanged(function(u){
    stop(); stopShop(); S.user = u; S.me = null; S.items = []; S.orders = []; S.view = 'shop';
    listenPublic();
    if (!u) { S.st = 'out'; render(); return; }
    if (String(u.email||'').toLowerCase() === SHOP_EMAIL) { S.st = 'shop'; render(); return; }
    S.st = 'loading'; render(); listen(u);
  });
})();
</script>
</body>
</html>
