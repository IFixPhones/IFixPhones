<style>
:root{--bg:#f5f5f7;--ink:#1d1d1f;--sub:#6e6e73;--line:#d2d2d7;--blue:#0071e3;--blue2:#0077ed;--link:#0066cc;--green:#1a7f37;--amber:#b25000;--red:#c9302c;--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;--r:18px}
*{box-sizing:border-box;margin:0;padding:0}

button{font:inherit;color:inherit;cursor:pointer}
.w{max-width:1120px;margin:0 auto;padding:0 22px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* nav */
.hdr{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.8);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(0,0,0,.08)}

.cta{display:flex;gap:22px;justify-content:center;align-items:center;margin-top:26px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 24px;font-size:17px;font-weight:400;background:var(--blue);color:#fff}

.more{border:0;background:none;color:var(--link);font-size:17px}.more::after{content:" ›"}.more:hover{text-decoration:underline}
.art{display:flex;justify-content:center;align-items:flex-end;gap:clamp(14px,4vw,48px);margin:46px auto 0;padding:46px 20px 0;background:var(--bg);border-radius:28px;max-width:980px;height:clamp(220px,32vw,340px);overflow:hidden}

.page{padding:40px 0 80px}

.state{max-width:560px;margin:70px auto;text-align:center;padding:0 10px}
.state .ic{font-size:40px}.state h2{font-size:clamp(30px,4vw,40px);margin-top:12px;letter-spacing:-.035em}.state p{color:var(--sub);font-size:17px;margin-top:10px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:rgba(29,29,31,.92);backdrop-filter:blur(10px);color:#fff;padding:11px 20px;border-radius:999px;font-size:14px;z-index:70;opacity:0;transition:opacity .25s;pointer-events:none}

    else if (a === 'reorder') {
      var ro = S.orders.filter(function(x){ return x.id === b.getAttribute('data-id'); })[0]; if (!ro) return;
      var added = 0; (ro.items||[]).forEach(function(l){ var it = itemById(l.id); if (it && it.avail > 0) { S.cart[l.id] = Math.min(it.avail, (S.cart[l.id] || 0) + l.qty); added++; } });
      saveCart(); S.view = 'shop'; render(); if (added) openCart(); else toast('Those parts are out of stock right now');
    }
    else if (a === 'cancel') {
      if (!confirm('Cancel this order?')) return;
      var o3 = S.orders.filter(function(x){ return x.id === b.getAttribute('data-id'); })[0];
      firebase.firestore().doc('wsorders/' + b.getAttribute('data-id')).update({status:'cancelled', cancelledAt:Date.now()}).then(function(){ toast('Order cancelled'); push('Wholesale order cancelled', (o3 && o3.code || '') + ' · ' + ((S.me||{}).shop || '')); }).catch(function(){ toast('Couldn’t cancel. Call ' + SHOP_PHONE + '.'); });
    }
  });
  var qT; $('#q').addEventListener('input', function(e){ S.q = e.target.value; clearTimeout(qT); qT = setTimeout(function(){ if (S.view !== 'shop') S.view = 'shop'; render(); }, 120); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && dlg && e.target.matches && e.target.matches('.dlg input')) { var bt = dlg.querySelector('.btn.full'); if (bt) bt.click(); }
    if (e.key === 'Escape') { closeDlg(); closeDrawer(); }
  });

  /* ---------- data ---------- */
  function listenPublic(){
    unsubs.push(firebase.firestore().doc('public/wscatalog').onSnapshot(function(snap){ S.pub = (snap.exists && (snap.data() || {}).items) || []; render(); }, function(){}));
  }
  function listen(u){
    var db = firebase.firestore();
    unsubs.push(db.doc('wholesalers/' + u.uid).onSnapshot(function(snap){
      if (!snap.exists) {
        if (S.applying) { var o = S.applying; S.applying = null; writeApp(u, o).catch(function(){}); return; }
        S.me = null; S.st = 'nodoc'; render(); return;
      }
      var was = S.me && S.me.status;
      S.me = snap.data(); S.st = 'in';
      if (S.me.status === 'approved' && was !== 'approved') startShop(u);
      if (S.me.status !== 'approved') stopShop();
      render();
    }, function(){ S.st = 'nodb'; render(); }));
  }
  function startShop(u){
    stopShop(); loadCart();
    var db = firebase.firestore();
    shopUnsubs.push(db.doc('wholesale/catalog').onSnapshot(function(snap){ S.items = (snap.exists && (snap.data() || {}).items) || []; render(); }, function(){ S.items = []; render(); }));
    shopUnsubs.push(db.collection('wsorders').where('uid', '==', u.uid).onSnapshot(function(snap){
      S.orders = snap.docs.map(function(d){ var o = d.data(); o.id = d.id; return o; }).sort(function(a, b){ return b.createdAt - a.createdAt; }); render();
    }, function(){}));
  }

  if (!window.firebase) { S.st = 'nodb'; render(); return; }
  firebase.initializeApp(FB_CONFIG);
  firebase.auth().onAuthStateChanged(function(u){
    stop(); stopShop(); S.user = u; S.me = null; S.items = []; S.orders = []; S.view = 'shop';
    listenPublic();
    if (!u) { S.st = 'out'; render(); return; }
    if (String(u.email||'').toLowerCase() === SHOP_EMAIL) { S.st = 'shop'; render(); return; }
    S.st = 'loading'; render(); listen(u);
  });
})();
</script>
</body>
</html>
