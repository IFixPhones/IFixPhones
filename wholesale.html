<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wholesale | iFixPhones</title>
<meta name="description" content="iFixPhones wholesale screens and batteries for approved repair shops in San Antonio.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--mist:#f5f5f7;--ink:#1d1d1f;--graphite:#6e6e73;--blue:#0071e3;--green:#1a7f37;--red:#c9302c;--line:#d2d2d7;--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);color:var(--ink);background:var(--mist);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;min-height:100vh}
a{color:#0066cc;text-decoration:none}
button{font:inherit;color:inherit}
.nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(0,0,0,.08)}
.nav .w{display:flex;align-items:center;justify-content:space-between;height:52px;gap:12px}
.brand{font-weight:600;font-size:18px;color:var(--ink)}
.brand span{color:var(--graphite);font-weight:500;margin-left:6px}
.w{max-width:980px;margin:0 auto;padding:0 22px}
.narrow{max-width:520px}
h1{font-size:clamp(32px,6vw,46px);letter-spacing:-.03em;line-height:1.05;margin-top:44px;text-align:center}
.lede{font-size:18px;color:var(--graphite);text-align:center;margin-top:10px;line-height:1.4}
.card{background:#fff;border-radius:22px;padding:24px;margin-top:24px;box-shadow:0 2px 20px rgba(0,0,0,.04)}
.seg{display:flex;background:#e8e8ed;border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:9px 10px;font-size:15px;font-weight:500;cursor:pointer;color:var(--graphite);white-space:nowrap}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.fields{display:grid;gap:12px;margin-top:18px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.g2{grid-template-columns:1fr}}
.field{position:relative}
.field input,.field textarea,.field select{width:100%;font:inherit;font-size:17px;background:#fff;border:1px solid #86868b;border-radius:12px;padding:25px 14px 8px;outline:none;min-height:58px;-webkit-appearance:none;appearance:none}
.field textarea{min-height:84px;resize:vertical}
.field label{position:absolute;left:15px;top:8px;font-size:12px;color:var(--graphite);pointer-events:none}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,113,227,.2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;background:var(--blue);color:#fff;border-radius:999px;padding:13px 26px;font-size:17px;font-weight:500;cursor:pointer}
.btn.full{width:100%;margin-top:16px}
.btn.ghost{background:#e8e8ed;color:var(--ink)}
.btn.sm{padding:8px 16px;font-size:15px}
.btn:disabled{opacity:.55;cursor:default}
.link{background:none;border:0;color:#0066cc;cursor:pointer;font-size:15px;padding:6px 0}
.err{color:var(--red);margin-top:12px;font-size:15px;min-height:1px}
.ok{color:var(--green)}
.hint{font-size:13px;color:var(--graphite);margin-top:10px;line-height:1.45}
.center{text-align:center}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-size:13px;font-weight:600}
.pill.new{background:#e8f1fd;color:#0058b0}.pill.confirmed{background:#fff4dd;color:#8a5a00}.pill.ready{background:#e3f6e8;color:var(--green)}.pill.done{background:#ececf0;color:#3a3a3c}.pill.cancelled{background:#fdecec;color:var(--red)}
/* shop */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:28px;flex-wrap:wrap}
.top h2{font-size:28px;letter-spacing:-.02em}
.top .who{color:var(--graphite);font-size:15px}
.tools{display:flex;gap:10px;margin-top:18px;align-items:center;flex-wrap:wrap}
.tools .seg{flex:0 1 420px}
.search{flex:1 1 220px;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:0 12px;min-height:44px}
.search input{border:0;outline:0;font:inherit;font-size:16px;flex:1;background:none;min-width:0}
.chips{display:flex;gap:8px;margin-top:14px;overflow-x:auto;padding-bottom:2px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.models{margin-top:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;padding-bottom:120px}
.model{background:#fff;border-radius:18px;padding:16px 18px;box-shadow:0 2px 14px rgba(0,0,0,.035)}
.model h3{font-size:18px;letter-spacing:-.01em}
.item{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid #ececf0}
.model h3+.item{border-top:0;margin-top:4px}
.item .nm{flex:1;min-width:0}
.item .nm b{display:block;font-size:15px;font-weight:600}
.item .nm span{font-size:13px;color:var(--graphite)}
.item .nm span.out{color:var(--red)}
.item .pr{font-weight:600;font-size:16px;white-space:nowrap}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.step button{border:0;background:#fff;width:34px;height:34px;font-size:19px;cursor:pointer;color:var(--blue)}
.step button:disabled{color:#c7c7cc;cursor:default}
.step b{min-width:26px;text-align:center;font-size:15px}
.add{border:0;background:#e8f1fd;color:#0058b0;border-radius:999px;padding:8px 16px;font-size:15px;font-weight:600;cursor:pointer}
.add:disabled{background:#f0f0f3;color:#aeaeb2;cursor:default}
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(255,255,255,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(0,0,0,.08)}
.cartbar .w{display:flex;align-items:center;justify-content:space-between;gap:12px}
.cartbar .sum b{font-size:18px}.cartbar .sum span{display:block;font-size:13px;color:var(--graphite)}
.empty{text-align:center;padding:50px 20px;color:var(--graphite)}
.empty h3{color:var(--ink);font-size:20px;margin-bottom:6px}
.orders{margin-top:16px;display:grid;gap:12px;padding-bottom:60px}
.ord{background:#fff;border-radius:18px;padding:16px 18px;box-shadow:0 2px 14px rgba(0,0,0,.035)}
.ord .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ord .hd b{font-size:17px}
.ord ul{list-style:none;margin-top:10px;font-size:15px}
.ord li{display:flex;justify-content:space-between;gap:10px;padding:4px 0;color:#3a3a3c}
.ord .tot{display:flex;justify-content:space-between;border-top:1px solid #ececf0;margin-top:8px;padding-top:8px;font-weight:600}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:640px){.scrim{align-items:center}}
.sheet{background:#fff;width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:22px 22px calc(22px + env(safe-area-inset-bottom))}
@media (min-width:640px){.sheet{border-radius:22px}}
.sheet h2{font-size:22px;letter-spacing:-.02em}
.lines{margin-top:14px}
.line{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #ececf0}
.line .nm{flex:1;min-width:0;font-size:15px}.line .nm span{display:block;color:var(--graphite);font-size:13px}
.totals{border-top:1px solid #ececf0;margin-top:6px;padding-top:12px;font-size:15px}
.totals div{display:flex;justify-content:space-between;padding:3px 0}
.totals .big{font-size:18px;font-weight:700}
.opts{display:flex;gap:8px;margin-top:14px}
.opts label{flex:1;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;font-size:15px}
.opts input{accent-color:var(--blue)}
.state{max-width:520px;margin:0 auto;text-align:center}
.state .ic{width:64px;height:64px;border-radius:50%;margin:48px auto 0;display:flex;align-items:center;justify-content:center;font-size:30px;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.06)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#1d1d1f;color:#fff;padding:11px 18px;border-radius:999px;font-size:15px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
footer{border-top:1px solid var(--line);padding:22px 0 30px;font-size:12px;color:var(--graphite);margin-top:30px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.skel{height:120px;border-radius:18px;background:linear-gradient(90deg,#ececf0,#f6f6f8,#ececf0);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
</style>
</head>
<body>
<nav class="nav"><div class="w"><a class="brand" href="/">iFixPhones<span>Wholesale</span></a><div id="navr"></div></div></nav>
<main id="app"><div class="w"><div class="skel" style="margin-top:40px"></div></div></main>

<script src="fb-app.js"></script>
<script src="fb-auth.js"></script>
<script src="fb-firestore.js"></script>
<script>
(function(){
  var FB_CONFIG = {apiKey:"AIzaSyADty-4Af9uDsTSY5MDUr0pfDlSF3HS9DI", authDomain:"ifixphones-ca10e.firebaseapp.com", projectId:"ifixphones-ca10e", storageBucket:"ifixphones-ca10e.firebasestorage.app", messagingSenderId:"230387153893", appId:"1:230387153893:web:ddbdac71ff0b1c56284d0c"};
  var SHOP_EMAIL = 'ubringifix24@gmail.com', SHOP_PHONE = '(210) 773-3548', TAX = 0.0825;
  var PO_TOKEN = 'a5kkcfdzh96mzd9vvq56cof48ncp38', PO_USER = 'uku53twtd8174esng6mszeyofke9kh';
  var S = {st:'loading', mode:'signin', tab:'Screens', q:'', brand:'', cart:{}, items:[], orders:[], me:null, user:null};
  var unsubs = [];
  function $(s, r){ return (r||document).querySelector(s); }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function money(n){ n = Math.round((Number(n)||0) * 100) / 100; return '$' + n.toFixed(2); }
  function digits(s){ return String(s||'').replace(/\D/g, ''); }
  function fmtPhone(s){ var d = digits(s).slice(-10); return d.length === 10 ? '(' + d.slice(0,3) + ') ' + d.slice(3,6) + '-' + d.slice(6) : s; }
  function toast(m){ var t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(function(){ t.classList.remove('on'); }, 2600); }
  function push(title, msg){ try { fetch('https://api.pushover.net/1/messages.json', {method:'POST', mode:'no-cors', body:new URLSearchParams({token:PO_TOKEN, user:PO_USER, title:title, message:msg, priority:'1', url:'https://ifixphones.net/tickets.html', url_title:'Open tickets'})}).catch(function(){}); } catch(e) {} }
  function stop(){ unsubs.forEach(function(u){ try { u(); } catch(e) {} }); unsubs = []; }
  function authMsg(e){
    var c = (e && e.code) || '';
    if (/wrong-password|invalid-credential|user-not-found|invalid-login/.test(c)) return 'That email and password don’t match. Try again or reset your password.';
    if (/email-already-in-use/.test(c)) return 'That email already has an account. Sign in instead.';
    if (/weak-password/.test(c)) return 'Use a password with at least 8 characters.';
    if (/invalid-email/.test(c)) return 'Check the email address.';
    if (/too-many-requests/.test(c)) return 'Too many tries. Wait a few minutes and try again.';
    if (/network/.test(c)) return 'No internet connection. Check it and try again.';
    if (/operation-not-allowed/.test(c)) return 'Wholesale sign-in isn’t turned on yet. Call us at ' + SHOP_PHONE + '.';
    return 'Something went wrong. Try again, or call ' + SHOP_PHONE + '.';
  }
  function loadCart(){ try { S.cart = JSON.parse(localStorage.getItem('ifx_ws_cart_' + S.user.uid) || '{}') || {}; } catch(e) { S.cart = {}; } }
  function saveCart(){ try { localStorage.setItem('ifx_ws_cart_' + S.user.uid, JSON.stringify(S.cart)); } catch(e) {} }
  function itemById(id){ return S.items.filter(function(i){ return i.id === id; })[0]; }
  function cartLines(){ return Object.keys(S.cart).map(function(id){ var i = itemById(id); return i && S.cart[id] > 0 ? {item:i, qty:Math.min(S.cart[id], Math.max(0, i.avail))} : null; }).filter(function(x){ return x && x.qty > 0; }); }
  function cartCount(){ return cartLines().reduce(function(a, l){ return a + l.qty; }, 0); }
  function cartSub(){ return cartLines().reduce(function(a, l){ return a + l.qty * l.item.price; }, 0); }
  function exempt(){ return !!(S.me && S.me.taxExempt); }

  /* ---------- render ---------- */
  function render(){
    var app = $('#app'), nav = $('#navr');
    nav.innerHTML = S.user && S.st !== 'shop' ? '<button class="link" data-a="signout">Sign out</button>' : '<a class="link" href="tel:2107733548">' + SHOP_PHONE + '</a>';
    if (S.st === 'loading') { app.innerHTML = '<div class="w"><div class="skel" style="margin-top:40px"></div></div>'; return; }
    if (S.st === 'nodb') { app.innerHTML = state('⚠️', 'Couldn’t load', 'Check your internet connection and reload the page.'); return; }
    if (S.st === 'out') { app.innerHTML = authView(); return; }
    if (S.st === 'shop') { app.innerHTML = state('🛠️', 'You’re signed in as the shop', 'Manage wholesale shops, prices and orders in the Tickets app → Wholesale tab.', '<a class="btn full" href="/tickets.html">Open Tickets</a>'); return; }
    if (S.st === 'nodoc') { app.innerHTML = state('📝', 'Finish your application', 'We need a few details about your shop.', '') ; app.querySelector('.state').insertAdjacentHTML('beforeend', '<div class="card" style="text-align:left">' + applyFields(true) + '</div>'); return; }
    var me = S.me || {};
    if (me.status === 'pending') { app.innerHTML = state('⏳', 'Thanks, ' + esc((me.name||'').split(' ')[0] || 'there') + '!', '<b>' + esc(me.shop) + '</b> is waiting for approval. We usually review new shops within one business day and will text you at ' + esc(fmtPhone(me.phone)) + '.', '<p class="hint">Questions? Call or text ' + SHOP_PHONE + '.</p>'); return; }
    if (me.status === 'declined' || me.status === 'off') { app.innerHTML = state('🔒', 'Wholesale access is off', 'This account can’t see wholesale prices right now. Call or text ' + SHOP_PHONE + ' if you think this is a mistake.'); return; }
    app.innerHTML = shopView();
    var q = $('#q'); if (q && S.focusQ) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  }
  function state(ic, h, p, extra){ return '<div class="w"><div class="state"><div class="ic" aria-hidden="true">' + ic + '</div><h1 style="margin-top:18px;font-size:32px">' + h + '</h1><p class="lede">' + p + '</p>' + (extra||'') + '</div></div>'; }

  function authView(){
    var signin = S.mode === 'signin', reset = S.mode === 'reset';
    var form = reset ?
      '<div class="fields"><div class="field"><label for="em">Email</label><input id="em" type="email" autocomplete="email" value="' + esc(S.em||'') + '"></div></div>' +
      '<button class="btn full" data-a="reset">Send reset link</button><div class="err" id="err" role="alert"></div><p class="center"><button class="link" data-a="mode" data-v="signin">Back to sign in</button></p>'
    : signin ?
      '<div class="fields"><div class="field"><label for="em">Email</label><input id="em" type="email" autocomplete="email" value="' + esc(S.em||'') + '"></div>' +
      '<div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"></div></div>' +
      '<button class="btn full" data-a="signin">Sign in</button><div class="err" id="err" role="alert"></div><p class="center"><button class="link" data-a="mode" data-v="reset">Forgot password?</button></p>'
    : applyFields(false);
    return '<div class="w narrow"><h1>Wholesale</h1><p class="lede">Screens and batteries for repair shops. Approved shops only.</p>' +
      '<div class="card">' + (reset ? '<h2 style="font-size:20px">Reset your password</h2><p class="hint">We’ll email you a link.</p>' :
      '<div class="seg" role="group" aria-label="Sign in or apply"><button data-a="mode" data-v="signin" aria-pressed="' + signin + '">Sign in</button><button data-a="mode" data-v="apply" aria-pressed="' + !signin + '">Apply for access</button></div>') +
      form + '</div>' +
      '<p class="hint center" style="margin-top:18px">Prices are only shown to shops we’ve approved. Need help? Call ' + SHOP_PHONE + '.</p></div>';
  }
  function applyFields(existing){
    return '<div class="fields">' +
      '<div class="field"><label for="ap-shop">Shop / business name</label><input id="ap-shop" maxlength="80" autocomplete="organization"></div>' +
      '<div class="g2"><div class="field"><label for="ap-name">Your name</label><input id="ap-name" maxlength="60" autocomplete="name"></div>' +
      '<div class="field"><label for="ap-phone">Cell phone</label><input id="ap-phone" type="tel" maxlength="20" autocomplete="tel"></div></div>' +
      '<div class="g2"><div class="field"><label for="ap-city">City</label><input id="ap-city" maxlength="60" value="San Antonio"></div>' +
      '<div class="field"><label for="ap-tax">TX sales tax permit # (11 digits, optional)</label><input id="ap-tax" maxlength="30" inputmode="numeric"></div></div>' +
      (existing ? '' :
      '<div class="field"><label for="em">Email</label><input id="em" type="email" autocomplete="email"></div>' +
      '<div class="field"><label for="pw">Create a password (8+ characters)</label><input id="pw" type="password" autocomplete="new-password"></div>') +
      '</div><p class="hint"><b>Buying tax-free:</b> enter your Texas sales tax permit number, then give us a signed Texas Resale Certificate (Form 01-339) at your first pickup. Until we have it, 8.25% sales tax is added. A permit number alone isn’t enough under Texas rules.</p>' +
      '<button class="btn full" data-a="' + (existing ? 'finish' : 'apply') + '">Apply for wholesale</button><div class="err" id="err" role="alert"></div>';
  }

  function shopView(){
    var me = S.me || {};
    var tabs = ['Screens', 'Batteries', 'My orders'];
    var openN = S.orders.filter(function(o){ return o.status !== 'done' && o.status !== 'cancelled'; }).length;
    var h = '<div class="w"><div class="top"><div><h2>' + esc(me.shop || 'Wholesale') + '</h2><div class="who">Wholesale prices · ' + (exempt() ? 'tax-free (resale certificate on file)' : '8.25% sales tax added · bring a signed Form 01-339 to buy tax-free') + '</div></div></div>' +
      '<div class="tools"><div class="seg" role="group" aria-label="Section">' + tabs.map(function(t){ return '<button data-a="tab" data-v="' + t + '" aria-pressed="' + (S.tab === t) + '">' + t + (t === 'My orders' && openN ? ' (' + openN + ')' : '') + '</button>'; }).join('') + '</div>' +
      (S.tab !== 'My orders' ? '<label class="search"><span class="sr">Search models</span><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#6e6e73" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="5.2"/><path d="M11 11l3.5 3.5"/></svg><input id="q" type="search" placeholder="Search, e.g. 14 Pro Max" value="' + esc(S.q) + '" autocomplete="off"></label>' : '') + '</div>';
    if (S.tab === 'My orders') return h + ordersView() + '</div>';
    var list = S.items.filter(function(i){ return i.cat === S.tab; });
    var brands = []; list.forEach(function(i){ if (brands.indexOf(i.brand) < 0) brands.push(i.brand); });
    if (brands.length > 1) { if (brands.indexOf(S.brand) < 0) S.brand = brands[0]; h += '<div class="chips">' + brands.map(function(b){ return '<button class="chip" data-a="brand" data-v="' + esc(b) + '" aria-pressed="' + (S.brand === b && !S.q) + '">' + esc(b.replace('Apple ', '')) + '</button>'; }).join('') + '</div>'; }
    var q = S.q.toLowerCase().trim();
    if (q) list = list.filter(function(i){ var hay = (i.model + ' ' + i.label).toLowerCase(); return q.split(/\s+/).every(function(w){ return hay.indexOf(w) > -1; }); });
    else if (brands.length > 1) list = list.filter(function(i){ return i.brand === S.brand; });
    var groups = [], by = {};
    list.forEach(function(i){ if (!by[i.model]) { by[i.model] = []; groups.push(i.model); } by[i.model].push(i); });
    if (!groups.length) h += '<div class="empty"><h3>' + (q ? 'No matches' : 'Nothing listed yet') + '</h3><p>' + (q ? 'Try a shorter search, like “14 Pro”.' : 'Check back soon, or call ' + SHOP_PHONE + '.') + '</p></div>';
    else h += '<div class="models">' + groups.map(function(m){
      return '<section class="model"><h3>' + esc(m) + '</h3>' + by[m].map(itemRow).join('') + '</section>';
    }).join('') + '</div>';
    var n = cartCount();
    if (n) h += '<div class="cartbar"><div class="w"><div class="sum"><b>' + money(cartSub()) + '</b><span>' + n + ' item' + (n > 1 ? 's' : '') + (exempt() ? '' : ' · plus tax') + '</span></div><button class="btn" data-a="review">Review order</button></div></div>';
    return h + '</div>';
  }
  function itemRow(i){
    var inCart = S.cart[i.id] || 0, out = i.avail <= 0;
    var stock = out ? '<span class="out">Out of stock</span>' : '<span>' + (i.avail >= 20 ? '20+' : i.avail) + ' in stock</span>';
    var ctl = inCart ? '<div class="step"><button data-a="q" data-id="' + esc(i.id) + '" data-v="-1" aria-label="One less">−</button><b>' + inCart + '</b><button data-a="q" data-id="' + esc(i.id) + '" data-v="1" aria-label="One more"' + (inCart >= i.avail ? ' disabled' : '') + '>+</button></div>'
      : '<button class="add" data-a="q" data-id="' + esc(i.id) + '" data-v="1"' + (out ? ' disabled' : '') + '>Add</button>';
    return '<div class="item"><div class="nm"><b>' + esc(i.label) + '</b>' + stock + '</div><div class="pr">' + money(i.price) + '</div>' + ctl + '</div>';
  }
  var ST = {new:'Sent', confirmed:'Confirmed', ready:'Ready for pickup', done:'Completed', cancelled:'Cancelled'};
  function ordersView(){
    if (!S.orders.length) return '<div class="empty"><h3>No orders yet</h3><p>Pick screens or batteries and send your first order.</p></div>';
    return '<div class="orders">' + S.orders.map(function(o){
      var d = new Date(o.createdAt);
      return '<article class="ord"><div class="hd"><div><b>Order ' + esc(o.code) + '</b><div class="hint" style="margin-top:2px">' + d.toLocaleDateString('en-US', {month:'short', day:'numeric'}) + ' · ' + d.toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'}) + ' · ' + (o.method === 'delivery' ? 'Delivery' : 'Pickup') + '</div></div><span class="pill ' + esc(o.status) + '">' + esc(ST[o.status] || o.status) + '</span></div>' +
        '<ul>' + (o.items||[]).map(function(l){ return '<li><span>' + l.qty + ' × ' + esc(l.model) + ' · ' + esc(l.label) + '</span><span>' + money(l.qty * l.price) + '</span></li>'; }).join('') + '</ul>' +
        '<div class="tot"><span>' + (o.total ? 'Total' : 'Subtotal') + '</span><span>' + money(o.total || o.subtotal) + '</span></div>' +
        (o.status === 'new' ? '<p style="margin-top:10px"><button class="link" style="color:var(--red)" data-a="cancel" data-id="' + esc(o.id) + '">Cancel this order</button></p>' : '') +
        (o.shopNote ? '<p class="hint">Note from iFixPhones: ' + esc(o.shopNote) + '</p>' : '') + '</article>';
    }).join('') + '</div>';
  }

  /* ---------- cart / review ---------- */
  function review(){
    var lines = cartLines(); if (!lines.length) return;
    var sub = cartSub(), tax = exempt() ? 0 : Math.round(sub * TAX * 100) / 100;
    var el = document.createElement('div'); el.className = 'scrim';
    el.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="rv-h"><h2 id="rv-h">Review order</h2><div class="lines">' + lines.map(function(l){
      return '<div class="line"><div class="nm">' + esc(l.item.model) + '<span>' + esc(l.item.label) + ' · ' + money(l.item.price) + ' each</span></div><div class="step"><button data-a="q" data-id="' + esc(l.item.id) + '" data-v="-1" aria-label="One less">−</button><b>' + l.qty + '</b><button data-a="q" data-id="' + esc(l.item.id) + '" data-v="1" aria-label="One more"' + (l.qty >= l.item.avail ? ' disabled' : '') + '>+</button></div><div style="width:72px;text-align:right;font-weight:600">' + money(l.qty * l.item.price) + '</div></div>';
    }).join('') + '</div>' +
    '<div class="totals"><div><span>Subtotal</span><span>' + money(sub) + '</span></div><div><span>' + (exempt() ? 'Sales tax (resale certificate on file)' : 'Sales tax 8.25%') + '</span><span>' + money(tax) + '</span></div><div class="big"><span>Estimated total</span><span>' + money(sub + tax) + '</span></div></div>' +
    '<div class="opts" role="radiogroup" aria-label="Pickup or delivery"><label><input type="radio" name="mt" value="pickup" checked> Pickup at shop</label><label><input type="radio" name="mt" value="delivery"> Local delivery</label></div>' +
    '<div class="field" style="margin-top:12px"><label for="rv-note">Note (optional)</label><textarea id="rv-note" maxlength="400" placeholder=" "></textarea></div>' +
    '<p class="hint">This sends an order request. We’ll confirm stock and text you when it’s ready. Pay at pickup: cash, Zelle, or card (3% card fee).</p>' +
    '<button class="btn full" id="rv-send">Send order · ' + money(sub + tax) + '</button><button class="btn ghost full" style="margin-top:8px" data-close>Keep shopping</button><div class="err" id="rv-err" role="alert"></div></div>';
    document.body.appendChild(el);
    el.addEventListener('click', function(e){ if (e.target === el || e.target.hasAttribute('data-close')) el.remove(); });
    $('#rv-send', el).addEventListener('click', function(){ sendOrder(el); });
    S.modal = el;
  }
  function sendOrder(el){
    var btn = $('#rv-send', el), err = $('#rv-err', el), lines = cartLines(); if (!lines.length) return;
    btn.disabled = true; btn.textContent = 'Sending…'; err.textContent = '';
    var me = S.me || {}, now = Date.now(), sub = Math.round(cartSub() * 100) / 100;
    var code = 'W' + now.toString(36).slice(-5).toUpperCase();
    var o = {uid:S.user.uid, shop:me.shop || '', name:me.name || '', phone:me.phone || '', email:S.user.email || '',
      items:lines.map(function(l){ return {id:l.item.id, brand:l.item.brand, model:l.item.model, label:l.item.label, cat:l.item.cat, price:l.item.price, qty:l.qty}; }),
      subtotal:sub, method:(el.querySelector('input[name=mt]:checked')||{}).value || 'pickup', note:$('#rv-note', el).value.trim().slice(0, 400), status:'new', createdAt:now, code:code};
    firebase.firestore().collection('wsorders').add(o).then(function(){
      push('New WHOLESALE order ' + code, (me.shop || '') + ' · ' + lines.reduce(function(a,l){ return a + l.qty; }, 0) + ' items · ' + money(sub) + '\n' + lines.map(function(l){ return l.qty + '× ' + l.item.model + ' ' + l.item.label; }).join('\n'));
      S.cart = {}; saveCart(); el.remove(); S.modal = null; S.tab = 'My orders'; render(); toast('Order sent! We’ll text you when it’s ready.');
    }).catch(function(e){ btn.disabled = false; btn.textContent = 'Send order'; err.textContent = /permission/.test(e && e.code) ? 'Your account can’t order right now. Call ' + SHOP_PHONE + '.' : 'Couldn’t send. Check your connection and try again.'; });
  }
  function bump(id, d){
    var i = itemById(id); if (!i) return;
    var n = Math.max(0, Math.min((S.cart[id] || 0) + d, Math.max(0, i.avail)));
    if (n) S.cart[id] = n; else delete S.cart[id];
    saveCart();
    if (S.modal) { S.modal.remove(); S.modal = null; render(); if (cartCount()) review(); }
    else render();
  }

  /* ---------- auth actions ---------- */
  function val(id){ var e = document.getElementById(id); return e ? e.value.trim() : ''; }
  function appData(){
    var o = {shop:val('ap-shop'), name:val('ap-name'), phone:val('ap-phone'), city:val('ap-city'), taxId:val('ap-tax')};
    if (o.shop.length < 2) return 'Enter your shop or business name.';
    if (o.name.length < 2) return 'Enter your name.';
    if (digits(o.phone).length < 10) return 'Enter a 10-digit phone number.';
    if (o.taxId && digits(o.taxId).length !== 11) return 'A Texas sales tax permit number is 11 digits. Check it, or leave it blank.';
    return o;
  }
  function writeApp(u, o){
    var doc = {shop:o.shop.slice(0,80), name:o.name.slice(0,60), phone:fmtPhone(o.phone).slice(0,20), city:o.city.slice(0,60), taxId:o.taxId.slice(0,30), email:String(u.email||'').slice(0,100), status:'pending', createdAt:Date.now()};
    return firebase.firestore().doc('wholesalers/' + u.uid).set(doc).then(function(){
      push('New wholesale application', doc.shop + ' · ' + doc.name + ' · ' + doc.phone + (doc.taxId ? ' · tax permit ' + doc.taxId : ' · no tax permit') + '\nApprove it in Tickets → Wholesale');
    });
  }
  document.addEventListener('click', function(e){
    var b = e.target.closest('[data-a]'); if (!b) return;
    var a = b.getAttribute('data-a'), v = b.getAttribute('data-v'), err = $('#err');
    function fail(m){ if (err) err.textContent = m; b.disabled = false; }
    if (a === 'mode') { S.em = val('em') || S.em; S.mode = v; render(); var f = $('#app input'); if (f) f.focus(); }
    else if (a === 'signin') {
      var em = val('em'), pw = (document.getElementById('pw')||{}).value || '';
      if (!em || !pw) return fail('Enter your email and password.');
      b.disabled = true; S.em = em;
      firebase.auth().signInWithEmailAndPassword(em, pw).catch(function(x){ fail(authMsg(x)); });
    }
    else if (a === 'reset') {
      var em2 = val('em'); if (!em2) return fail('Enter your email.');
      b.disabled = true;
      firebase.auth().sendPasswordResetEmail(em2).then(function(){ err.className = 'err ok'; err.textContent = 'If that email has an account, a reset link is on its way. Check spam too.'; }).catch(function(x){ fail(authMsg(x)); });
    }
    else if (a === 'apply') {
      var o = appData(); if (typeof o === 'string') return fail(o);
      var em3 = val('em'), pw3 = (document.getElementById('pw')||{}).value || '';
      if (!/^\S+@\S+\.\S+$/.test(em3)) return fail('Enter a valid email.');
      if (pw3.length < 8) return fail('Use a password with at least 8 characters.');
      if (em3.toLowerCase() === SHOP_EMAIL) return fail('Use your own shop’s email.');
      b.disabled = true; b.textContent = 'Sending…'; S.applying = o;
      firebase.auth().createUserWithEmailAndPassword(em3, pw3).catch(function(x){ S.applying = null; b.textContent = 'Apply for wholesale'; fail(authMsg(x)); });
    }
    else if (a === 'finish') {
      var o2 = appData(); if (typeof o2 === 'string') return fail(o2);
      b.disabled = true;
      writeApp(S.user, o2).catch(function(){ fail('Couldn’t send. Try again.'); });
    }
    else if (a === 'signout') { stop(); firebase.auth().signOut(); }
    else if (a === 'tab') { S.tab = v; S.q = ''; render(); window.scrollTo(0, 0); }
    else if (a === 'brand') { S.brand = v; S.q = ''; render(); }
    else if (a === 'q') bump(b.getAttribute('data-id'), Number(v));
    else if (a === 'review') review();
    else if (a === 'cancel') {
      if (!confirm('Cancel this order?')) return;
      var o3 = S.orders.filter(function(x){ return x.id === b.getAttribute('data-id'); })[0];
      firebase.firestore().doc('wsorders/' + b.getAttribute('data-id')).update({status:'cancelled', cancelledAt:Date.now()}).then(function(){
        toast('Order cancelled'); push('Wholesale order cancelled', (o3 && o3.code || '') + ' · ' + ((S.me||{}).shop || ''));
      }).catch(function(){ toast('Couldn’t cancel. Call ' + SHOP_PHONE + '.'); });
    }
  });
  document.addEventListener('input', function(e){ if (e.target.id === 'q') { S.q = e.target.value; S.focusQ = true; render(); S.focusQ = false; } });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && e.target.matches && e.target.matches('#app .card input')) { var btn = $('#app .card .btn.full'); if (btn) btn.click(); }
    if (e.key === 'Escape' && S.modal) { S.modal.remove(); S.modal = null; }
  });

  /* ---------- data ---------- */
  function listen(u){
    var db = firebase.firestore();
    unsubs.push(db.doc('wholesalers/' + u.uid).onSnapshot(function(snap){
      if (!snap.exists) {
        if (S.applying) { var o = S.applying; S.applying = null; writeApp(u, o).catch(function(){}); return; }
        S.me = null; S.st = 'nodoc'; render(); return;
      }
      var was = S.me && S.me.status;
      S.me = snap.data(); S.st = 'in';
      if (S.me.status === 'approved' && was !== 'approved') startShop(u);
      if (S.me.status !== 'approved') stopShop();
      render();
    }, function(){ S.st = 'nodb'; render(); }));
  }
  var shopUnsubs = [];
  function stopShop(){ shopUnsubs.forEach(function(x){ try { x(); } catch(e) {} }); shopUnsubs = []; }
  function startShop(u){
    stopShop(); loadCart();
    var db = firebase.firestore();
    shopUnsubs.push(db.doc('wholesale/catalog').onSnapshot(function(snap){
      S.items = (snap.exists && (snap.data() || {}).items) || []; render();
    }, function(){ S.items = []; render(); }));
    shopUnsubs.push(db.collection('wsorders').where('uid', '==', u.uid).onSnapshot(function(snap){
      S.orders = snap.docs.map(function(d){ var o = d.data(); o.id = d.id; return o; }).sort(function(a, b){ return b.createdAt - a.createdAt; }); render();
    }, function(){}));
  }

  if (!window.firebase) { S.st = 'nodb'; render(); return; }
  firebase.initializeApp(FB_CONFIG);
  firebase.auth().onAuthStateChanged(function(u){
    stop(); stopShop(); S.user = u; S.me = null; S.items = []; S.orders = [];
    if (!u) { S.st = 'out'; render(); return; }
    if (String(u.email||'').toLowerCase() === SHOP_EMAIL) { S.st = 'shop'; render(); return; }
    S.st = 'loading'; render(); listen(u);
  });
})();
</script>
</body>
</html>
